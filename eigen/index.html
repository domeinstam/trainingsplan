/* ---------- trainingen verslepen naar een andere dag ----------
   telefoon: even vasthouden (zodat scrollen gewoon blijft werken) en dan schuiven; computer: met de muis slepen */
const RUN_DRAG = { sid:null, active:false, timer:null, x0:0, y0:0, dx:0, dy:0, ghost:null, over:null, touch:false, eat:false };
function runMoveTo(id, d){
  const s = runSes(id); if(!s || s.status!=='planned' || !runValidDate(d) || d===s.date) return false;
  if(d < todayISO()){ runMsg('Een training verzet je niet naar een dag die al voorbij is.', 'err'); return false; }
  const open = RUI.openId; runSet(['ses', id, 'date'], d); RUI.openId = open; RUI.scrollTo = null;
  runMsg(s.name.replace(/ – .*/,'')+' verzet naar '+runDateShort(d)+'.'); return true;
}
function runDragTarget(x, y){ const el = document.elementFromPoint(x, y); return (el && el.closest && el.closest('#view-program [data-day]')) || null; }
function runDragStart(){
  const D = RUN_DRAG, src = document.getElementById('run-'+D.sid); if(!src){ D.sid = null; return; }
  const sum = src.querySelector('summary'), r = sum.getBoundingClientRect();
  const g = document.createElement('div'); g.className = 'run-ghost'; g.innerHTML = sum.innerHTML; g.style.width = r.width+'px'; document.body.appendChild(g);
  D.ghost = g; D.dx = D.x0 - r.left; D.dy = D.y0 - r.top; D.active = true; src.classList.add('run-dragging');
  if(navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  runDragMove(D.x0, D.y0);
}
function runDragMove(x, y){
  const D = RUN_DRAG; D.ghost.style.transform = `translate(${x - D.dx}px, ${y - D.dy}px)`;
  const t = runDragTarget(x, y); if(D.over && D.over!==t) D.over.classList.remove('run-drop'); if(t) t.classList.add('run-drop'); D.over = t;
  if(y < 80) window.scrollBy(0, -14); else if(y > innerHeight - 80) window.scrollBy(0, 14);          // vanzelf meescrollen aan de rand
}
function runDragEnd(drop){
  const D = RUN_DRAG; clearTimeout(D.timer);
  if(D.active){
    const day = D.over && D.over.dataset.day, src = document.getElementById('run-'+D.sid);
    if(D.ghost) D.ghost.remove(); if(D.over) D.over.classList.remove('run-drop'); if(src) src.classList.remove('run-dragging');
    D.eat = true; setTimeout(()=>{ D.eat = false; }, 400);                        // de klik na het loslaten niet als open/dicht tellen
    if(drop && day && runMoveTo(D.sid, day)){ saveState(); renderCurrent(); coachSoon(); }
  }
  Object.assign(D, { sid:null, active:false, ghost:null, over:null });
}
document.addEventListener('pointerdown', e=>{
  const sum = e.target.closest && e.target.closest('#view-program details.run-day.planned[data-run-day] > summary'); if(!sum || e.button>0) return;
  const D = RUN_DRAG; D.sid = sum.parentElement.dataset.runDay; D.x0 = e.clientX; D.y0 = e.clientY; D.active = false; D.touch = e.pointerType!=='mouse';
  if(D.touch) D.timer = setTimeout(runDragStart, 380);
});
document.addEventListener('pointermove', e=>{
  const D = RUN_DRAG; if(!D.sid) return;
  if(!D.active){
    const moved = Math.hypot(e.clientX-D.x0, e.clientY-D.y0);
    if(D.touch){ if(moved>10){ clearTimeout(D.timer); D.sid = null; } return; }          // eerst bewegen = gewoon scrollen
    if(moved<6) return; runDragStart();
  }
  e.preventDefault(); runDragMove(e.clientX, e.clientY);
}, { passive:false });
document.addEventListener('touchmove', e=>{ if(RUN_DRAG.active) e.preventDefault(); }, { passive:false });
document.addEventListener('pointerup', ()=>{ if(RUN_DRAG.sid) runDragEnd(true); });
document.addEventListener('pointercancel', ()=>{ if(RUN_DRAG.sid) runDragEnd(false); });
document.addEventListener('click', e=>{ if(RUN_DRAG.eat && e.target.closest && e.target.closest('#view-program summary')){ e.preventDefault(); e.stopPropagation(); RUN_DRAG.eat = false; } }, true);
document.addEventListener('contextmenu', e=>{ if(RUN_DRAG.sid && e.target.closest && e.target.closest('#view-program summary')) e.preventDefault(); });

/* ===========================================================================
   HARDLOPEN — deel 4: Atempo Personal Coach (proef) — trainingen naar Intervals.icu → Garmin
   Rechtstreeks vanuit de app, zonder tussenserver en zonder API-sleutel: je verbindt Atempo per sessie met je
   Intervals.icu-account (OAuth met PKCE; rechten CALENDAR:WRITE, ACTIVITY:READ en WELLNESS:READ). Het toegangsbewijs staat alleen in
   sessionStorage (weg zodra het tabblad sluit) en nooit in je gegevens, back-ups, exports of de cloud.
   Koppelgegevens per training staan in session.ext.intervals, los van garminExternalId (uitgevoerde activiteiten).
   =========================================================================== */
var COACH_CLIENT_ID = '1644';                                   // Client ID van de Atempo-app bij Intervals.icu (openbaar, geen geheim)
/* zowel de openbare hoofdpagina als de eigen /eigen/-pagina draaien dezelfde code; Intervals.icu moet voor
   beide een geregistreerde redirect-URL zien. coachHere() geeft steeds het exacte huidige adres terug; dat
   wordt ook als redirect_uri gebruikt, zodat het altijd overeenkomt met waar de gebruiker al is. */
const COACH_REDIRECTS = ['https://apps.domeinstam.nl/trainingsplan/', 'https://apps.domeinstam.nl/trainingsplan/eigen/'];
const COACH_API = 'https://intervals.icu/api/v1/athlete/0';
const COACH_SCOPE = 'CALENDAR:WRITE,ACTIVITY:READ,WELLNESS:READ';   // agenda beheren + activiteiten lezen (runs koppelen) + dagwaarden lezen (grafieken)
const COACH_SS = 'atempo-intervals';                        // sessionStorage-sleutel (alleen dit tabblad, tijdelijk)
const COACH_EXT_RE = /^atempo-[A-Za-z0-9_-]{1,64}$/;

function coachSet(){ const st = RP().settings; st.coach = { variant:'text', lastOkAt:null, lastError:null, athlete:null, test:null, ...(st.coach||{}) }; return st.coach; }
const coachExtId = s => 'atempo-' + s.id;
const coachInfo = s => (s && s.ext && s.ext.intervals) || null;
const COACH_FORMAT = 3;      // 2 = elke stap los (geen herhaalblok); 3 = hartslag als % HR; een nieuwe vorm stuurt alles één keer opnieuw
function coachHash(s){       // vingerafdruk van wat naar Garmin gaat: vorm, datum, naam, stappen en doelen
  const str = JSON.stringify([COACH_FORMAT, s.date, s.name, (s.steps||[]).map(x=>[x.t,x.sec,x.target||null]), s.target||null]);
  let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36);
}
/* lokaal · verzonden · gewijzigd na verzenden · fout · verwijderd */
function coachState(s){
  const i = coachInfo(s); if(!i || i.status==='deleted') return 'local';
  if(i.status==='error') return 'error';
  if(s.status!=='planned' || s.date<todayISO()) return 'sent';          // voorbij: blijft zoals het naar Garmin ging (een nieuwe vorm stuurt niets opnieuw)
  return i.hash===coachHash(s) ? 'sent' : 'changed';
}

/* ---------- verbinden met Intervals.icu (OAuth + PKCE) ---------- */
function coachSess(){ try { return JSON.parse(sessionStorage.getItem(COACH_SS)||'{}'); } catch(e){ return {}; } }
function coachSessSave(o){ try { sessionStorage.setItem(COACH_SS, JSON.stringify(o)); } catch(e){} }
const coachHere = () => location.href.split(/[?#]/)[0].replace(/index\.html$/, '');
const coachCanConnect = () => !!COACH_CLIENT_ID && COACH_REDIRECTS.includes(coachHere());
const coachConnected = () => !!coachSess().token;
function coachRnd(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b=>('0'+b.toString(16)).slice(-2)).join(''); }
async function coachChallenge(verifier){
  const dig = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  let b = ''; dig.forEach(x=>{ b += String.fromCharCode(x); });
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function coachAuthUrl(){
  const verifier = coachRnd(48), state = coachRnd(16);
  coachSessSave({ ...coachSess(), pkce:{ verifier, state, at:Date.now() } });
  return 'https://intervals.icu/oauth/authorize?' + new URLSearchParams({ client_id:COACH_CLIENT_ID, redirect_uri:coachHere(), scope:COACH_SCOPE,
    state, code_challenge: await coachChallenge(verifier), code_challenge_method:'S256' });
}
async function coachConnect(){
  if(!COACH_CLIENT_ID) return runMsg('De Atempo-app is nog niet goedgekeurd door Intervals.icu.', 'err');
  if(!coachCanConnect()) return runMsg('Verbinden met Intervals.icu kan alleen in de webversie (apps.domeinstam.nl/trainingsplan).', 'err');
  const url = await coachAuthUrl();
  coachSessSave({ ...coachSess(), back:{ view:ui.view, tab:RUI.tab, openId:RUI.openId } });
  location.href = url;
}
/* terugkomst van Intervals.icu: ?code=…&state=… omwisselen voor een toegangsbewijs */
async function coachHandleRedirect(search){
  const q = new URLSearchParams(search!=null ? search : location.search), code = q.get('code'), st = q.get('state'), err = q.get('error');
  if(!code && !err) return false;
  if(search==null) history.replaceState(null, '', location.pathname + location.hash);
  const ss = coachSess(), p = ss.pkce; delete ss.pkce; coachSessSave(ss);
  const c = coachSet();
  if(err){ c.lastError = 'Geen toestemming gegeven bij Intervals.icu'; return true; }
  if(!p || p.state!==st || Date.now()-p.at > 10*60*1000){ c.lastError = 'Verbinden mislukt (onbekende of verlopen poging) — probeer opnieuw'; return true; }
  try {
    const r = await fetch('https://intervals.icu/api/oauth/token', { method:'POST', body:new URLSearchParams({ client_id:COACH_CLIENT_ID, code, code_verifier:p.verifier, redirect_uri:coachHere() }) });
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j || !j.access_token) throw new Error((j && j.error) || ('fout '+r.status));
    coachSessSave({ ...coachSess(), token:j.access_token, at:Date.now() });
    c.athlete = j.athlete ? { id:j.athlete.id, name:j.athlete.name||null } : c.athlete; c.lastOkAt = runNow(); c.lastError = null;
  } catch(e){ c.lastError = 'Verbinden met Intervals.icu mislukt: '+e.message; }
  return true;
}
async function coachDisconnect(){
  const t = coachSess().token; coachSessSave({});
  if(t){ try { await fetch('https://intervals.icu/api/v1/disconnect-app', { method:'DELETE', headers:{ Authorization:'Bearer '+t } }); } catch(e){} }
  runMsg('Verbinding met Intervals.icu verbroken en het toegangsbewijs ingetrokken.'); coachRerender();
}

/* ---------- runs ophalen uit Intervals.icu en koppelen aan je trainingen ---------- */
const COACH_TYPES = { Run:'running', TrailRun:'trail_running', VirtualRun:'virtual_run', Walk:'walking', Hike:'hiking' };
function coachPace(sec, m){ if(!(sec>0) || !(m>0)) return null; const s = Math.round(sec/(m/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
/* Intervals.icu-activiteit -> Atempo's Garmin-activiteit (zelfde vorm als uit de Garmin-export) */
function coachMapActivity(a){
  if(!a || !a.start_date_local) return null;
  const gid = a.source==='GARMIN_CONNECT' && a.external_id ? String(a.external_id).replace(/\.fit$/i,'') : null;
  return { externalId: gid ? 'garmin-'+gid : 'icu-'+a.id, date: a.start_date_local.slice(0,10), startTime: a.start_date_local.slice(0,19),
    type: COACH_TYPES[a.type] || String(a.type||'onbekend').toLowerCase(),
    durationMin: a.elapsed_time ? Math.round(a.elapsed_time/6)/10 : null, movingMin: a.moving_time ? Math.round(a.moving_time/6)/10 : null,
    distanceKm: a.distance ? Math.round(a.distance/10)/100 : null, avgPace: coachPace(a.moving_time, a.distance),
    avgHr: a.average_heartrate!=null ? Math.round(a.average_heartrate) : null, maxHr: a.max_heartrate!=null ? Math.round(a.max_heartrate) : null,
    vo2max: null, rpe: null, continuousMin: null, _source:'intervals.icu', _syncedAt: runNow() };
}
/* dagwaarden uit Intervals.icu -> state.garmin.daily (zelfde velden als de Garmin-export).
   Een dag uit een Garmin-export blijft ongemoeid; alleen nieuwe dagen of eerder uit Intervals.icu gehaalde dagen worden gevuld. */
const COACH_WELL = [['restingHr','restingHR',1], ['nightHrv','hrv',1], ['sleepDuration','sleepSecs',1/3600], ['sleepScore','sleepScore',1], ['weightKg','weight',1], ['vo2max','vo2max',1]];
async function coachFetchWellness(token){
  const oldest = addDays(todayISO(), -60), newest = todayISO();
  let r; try { r = await fetch(COACH_API+'/wellness?oldest='+oldest+'&newest='+newest, { headers:{ Authorization:'Bearer '+token, Accept:'application/json' } }); }
  catch(e){ return { err:'net' }; }
  if(r.status===401 || r.status===403) return { scope:true };
  if(!r.ok) return { err:r.status };
  const list = await r.json().catch(()=>[]), daily = state.garmin.daily; let days = 0;
  for(const w of (Array.isArray(list)?list:[])){
    const d = String((w && w.id) || '').slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    if(daily[d] && daily[d]._source!=='intervals.icu') continue;              // Garmin-export heeft voorrang
    const g = {};
    for(const [k,f,m] of COACH_WELL){ const v = num(w[f]); if(v!=null && v>0) g[k] = Math.round(v*m*100)/100; }
    if(!Object.keys(g).length) continue;
    const prev = daily[d] ? JSON.stringify(COACH_WELL.map(([k])=>daily[d][k] ?? null)) : null;
    daily[d] = { ...g, _source:'intervals.icu', _syncedAt: runNow() };
    if(prev !== JSON.stringify(COACH_WELL.map(([k])=>daily[d][k] ?? null))) days++;
  }
  return { days };
}
/* haalt de activiteiten van de afgelopen dagen op; nieuwe komen bij je Garmin-gegevens en worden (als het eenduidig is) gekoppeld */
async function coachFetchRuns(quiet){
  const token = coachSess().token; if(!token) return quiet ? null : runMsg('Verbind eerst met Intervals.icu.', 'err');
  const c = coachSet(), oldest = addDays(todayISO(), -14), newest = todayISO();
  let r; try { r = await fetch(COACH_API+'/activities?oldest='+oldest+'&newest='+newest, { headers:{ Authorization:'Bearer '+token, Accept:'application/json' } }); }
  catch(e){ if(!quiet) runMsg('Geen verbinding met Intervals.icu.', 'err'); return null; }
  if(r.status===401 || r.status===403){ c.needActivityScope = true; if(!quiet) runMsg('Atempo mag je gegevens nog niet lezen. Verbind opnieuw met Intervals.icu en geef toestemming voor activiteiten en dagwaarden.', 'err'); coachRerender(); return null; }
  if(!r.ok){ if(!quiet) runMsg('Intervals.icu gaf fout '+r.status+' bij het ophalen van je runs.', 'err'); return null; }
  const list = await r.json().catch(()=>[]); c.needActivityScope = false;
  const acts = state.garmin.activities, have = new Set(acts.map(a=>a.externalId)), added = [];
  for(const x of (Array.isArray(list)?list:[])){
    const a = coachMapActivity(x); if(!a || have.has(a.externalId)) continue;
    // al binnen via de Garmin-export (zelfde start, binnen 2 minuten)? dan niet nog eens
    if(acts.some(y=> y.startTime && a.startTime && Math.abs(Date.parse(y.startTime)-Date.parse(a.startTime)) < 120000)) continue;
    acts.push(a); have.add(a.externalId); added.push(a);
  }
  const linked = added.length ? runAutoLinkAfterImport(added) : 0;
  const wl = await coachFetchWellness(token);
  c.needActivityScope = !!wl.scope; c.lastRunsAt = runNow(); RUI.coachBusy = null;
  const parts = [];
  if(added.length) parts.push(added.length+' nieuwe activiteit(en)'+(linked?', '+linked+' gekoppeld aan je training':''));
  if(wl.days) parts.push('dagwaarden van '+wl.days+' dag(en) bijgewerkt');
  if(wl.scope && !quiet) runMsg('Runs opgehaald, maar Atempo mag je dagwaarden (HRV, rustpols, slaap) nog niet lezen. Verbind opnieuw met Intervals.icu en geef daarvoor toestemming.', 'err');
  else if(parts.length || !quiet) runMsg(parts.length ? 'Uit Intervals.icu: '+parts.join('; ')+'.' : 'Niets nieuws in Intervals.icu.');
  coachRerender();
  return { added: added.length, linked, days: wl.days || 0 };
}

/* ---------- aanroepen (alleen agenda-afspraken met een Atempo-sleutel) ---------- */
function coachToEvent(e){
  if(!COACH_EXT_RE.test(String(e.externalId||''))) throw new Error('Ongeldige Atempo-sleutel');
  if(!runValidDate(e.date)) throw new Error('Ongeldige datum');
  const ev = { category:'WORKOUT', type:'Run', start_date_local:e.date+'T00:00:00', name:String(e.name||'Atempo-training').slice(0,80), external_id:e.externalId };
  if(e.fitBase64){ ev.filename = e.filename || 'atempo.fit'; ev.file_contents_base64 = e.fitBase64; if(e.note) ev.description = e.note; }
  else if(e.text){ ev.description = e.text; }
  else throw new Error('Training zonder stappen');
  return ev;
}
async function coachCall(data){
  const token = coachSess().token;
  if(!token) throw new Error('Eerst verbinden met Intervals.icu (knop Verbinden met Intervals.icu)');
  let method = 'GET', path = '', body;
  if(data.action==='upsert'){ method = 'POST'; path = '/events/bulk?upsert=true'; body = data.events.map(coachToEvent); }
  else if(data.action==='delete'){ if(!data.externalIds.every(x=>COACH_EXT_RE.test(x))) throw new Error('Alleen Atempo-afspraken kunnen worden verwijderd'); method = 'PUT'; path = '/events/bulk-delete'; body = data.externalIds.map(x=>({ external_id:x })); }
  else if(data.action!=='ping') throw new Error('Onbekende handeling');
  let r;
  try { r = await fetch(COACH_API+path, { method, headers:{ Authorization:'Bearer '+token, Accept:'application/json', ...(body?{ 'Content-Type':'application/json' }:{}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new Error('Geen verbinding met Intervals.icu'); }
  const j = await r.json().catch(()=>null);
  if(r.status===401 || r.status===403){ coachSessSave({}); throw new Error('Toegang verlopen of ingetrokken — verbind opnieuw met Intervals.icu'); }
  if(!r.ok) throw new Error(r.status===429 ? 'Te veel verzoeken bij Intervals.icu, probeer het later opnieuw' : 'Intervals.icu gaf fout '+r.status);
  if(data.action==='ping') return { athlete: j ? { id:j.id, name:j.name||null } : null };
  if(data.action==='upsert') return { events: (Array.isArray(j)?j:[]).map(ev=>({ id:ev.id, external_id:ev.external_id })) };
  return { deleted: j && j.eventsDeleted };
}
/* bij het opstarten: terugkomst van Intervals.icu afhandelen */
window.addEventListener('load', ()=>{ coachHandleRedirect().then(back=>{ if(coachConnected()) setTimeout(()=>coachFetchRuns(true).finally(()=>coachSyncAll(false)), 1500); if(back){ saveState(); const ss = coachSess(), b = ss.back || {}; delete ss.back; coachSessSave(ss); if(typeof showView==='function'){ RUI.tab = b.tab || 'program'; if(b.openId){ RUI.openId = b.openId; RUI.scrollTo = b.openId; } showView(b.view || 'running'); } } }); });

/* Intervals.icu-workouttekst: elke stap op een eigen regel (geen herhaalblok), net als het FIT-bestand.
   Warmup/Cooldown als kopjes en de stapsoort per stap (intensity=…), zodat Intervals.icu die niet zelf uit een zone afleidt.
   Een doel (hartslag of tempo) komt alleen mee als het is ingesteld: per stap, anders het trainingsdoel voor de hardloopstappen.
   Hartslag gaat als % van de maximale hartslag (bv. 65-75% HR): losse bpm-waarden leest Intervals.icu niet als doel, en dan
   kwam er geen doel op het horloge. Intervals.icu rekent het percentage om met de maximale hartslag in je Intervals-instellingen. */
function coachText(s){
  const dur = sec => { const m = Math.floor(sec/60), r = sec%60; return m && r ? m+'m'+r+'s' : m ? m+'m' : r+'s'; };
  const tgText = tg => { const a = num(tg && tg.low), b = num(tg && tg.high); if(!tg || !(a>0) || !(b>0)) return '';
    if(tg.type==='hr'){ const mx = num(tg.hrMax) || num(s.target && s.target.hrMax) || (runHrMax() || {}).bpm; if(!(mx>0)) return '';
      const pc = v => Math.round(v/mx*100); return ' '+pc(Math.min(a,b))+'-'+pc(Math.max(a,b))+'% HR'; }
    if(tg.type==='pace') return ' '+secToPace(Math.min(a,b))+'-'+secToPace(Math.max(a,b))+'/km Pace';
    return ''; };
  const kind = { warmup:'warmup', run:'active', walk:'recovery', cooldown:'cooldown' };
  const line = st => '- '+RUN_STEP[st.t].nl+' '+dur(st.sec)+tgText(st.target ? st.target : (st.t==='run' ? s.target : null))+' intensity='+kind[st.t];
  const L = []; let main = false;
  (s.steps||[]).forEach(st=>{
    if(st.t==='warmup'){ L.push('Warmup', line(st)); main = false; }
    else if(st.t==='cooldown'){ L.push('', 'Cooldown', line(st)); main = false; }
    else { if(!main){ L.push(''); main = true; } L.push(line(st)); }
  });
  return L.join('\n').trim();
}
function coachB64(bytes){ let b = ''; for(let i=0;i<bytes.length;i++) b += String.fromCharCode(bytes[i]); return btoa(b); }
/* één training omzetten naar wat de serverfunctie accepteert */
function coachPayload(s, variant, extId){
  const base = { externalId: extId || coachExtId(s), date: s.date, name: s.name };
  if(variant==='text') return { ...base, text: coachText(s) };
  const f = fitExportSession(s); if(!f.ok) throw new Error('FIT-controle mislukt: '+f.errors.join('; '));
  return { ...base, fitBase64: coachB64(f.bytes), filename: fitAscii(s.name, 40)+'.fit', note: 'Gepland in Atempo.' };
}
function coachRerender(){ saveState(); if(typeof ui!=='undefined' && ['running','data','progress','today'].includes(ui.view)) renderCurrent(); }

async function coachSend(s, auto){
  const c = coachSet(), extId = coachExtId(s), prev = coachInfo(s) || {};
  RUI.coachBusy = s.id; coachRerender();
  try {
    const res = await coachCall({ action:'upsert', events:[coachPayload(s, 'text')] });
    const ev = (res.events||[])[0] || {};
    s.ext = s.ext || {}; s.ext.intervals = { externalId:extId, eventId: ev.id ?? prev.eventId ?? null, syncedAt:runNow(), status:'sent', error:null, hash:coachHash(s), variant:'text', gcSeen:false, watchSeen:false };
    c.lastOkAt = runNow(); c.lastError = null;
    runMsg(auto ? 'Bijgewerkt in Garmin.' : s.date > addDays(todayISO(),7) ? 'Naar Garmin gestuurd. Hij komt ongeveer 7 dagen van tevoren op je horloge.' : 'Naar Garmin gestuurd. Synchroniseer je horloge.');
  } catch(e){
    s.ext = s.ext || {}; s.ext.intervals = { ...prev, externalId:extId, status:'error', error:e.message, failedAt:runNow() };
    c.lastError = e.message; runMsg('Synchronisatie mislukt: '+e.message+' — de training staat gewoon in Atempo.', 'err');
  } finally { RUI.coachBusy = null; coachRerender(); }
}
async function coachRemove(extId, s, auto){
  try {
    await coachCall({ action:'delete', externalIds:[extId] });
    if(s){ s.ext = s.ext || {}; s.ext.intervals = { ...(coachInfo(s)||{}), externalId:extId, status:'deleted', syncedAt:runNow(), error:null }; }
    coachSet().lastError = null; runMsg(auto ? (RUI.msg ? RUI.msg+' ' : '')+'Ook uit Garmin gehaald.' : 'Uit Garmin gehaald.');
  } catch(e){ coachSet().lastError = e.message; runMsg('Verwijderen in Intervals.icu mislukt: '+e.message, 'err'); }
  coachRerender();
}
/* overslaan of verwijderen in Atempo: staat de training in Garmin, dan gaat hij daar vanzelf ook weg */
function coachAutoRemove(s){
  const i = coachInfo(s); if(!i || (i.status!=='sent' && i.status!=='error')) return;
  if(coachConnected()) coachRemove(i.externalId, s, true);
  else runMsg('Let op: deze training staat nog in Garmin. Verbind met Intervals.icu (Data & backup) om hem daar weg te halen.', 'err');
}
/* een training die al in Garmin staat en in Atempo verandert (datum, stappen, niveau), gaat vanzelf mee */
function coachSoon(){ clearTimeout(coachSoon.t); coachSoon.t = setTimeout(()=>coachSyncAll(false), 1200); }
/* Sync met Garmin: elke geplande training vanaf vandaag die nog niet (of niet meer actueel) in Intervals.icu staat,
   gaat in één keer mee. Gebeurt vanzelf zolang je verbonden bent; de knop doet hetzelfde op jouw verzoek. */
/* niet vanzelf naar Garmin (wel met de knop Sync met Garmin): een training van vandaag bij rood herstel, en Zeer intensief
   zolang het herstel van die dag niet groen is (voor latere dagen is dat nog niet bekend) */
function coachHold(s){
  const today = todayISO(), zi = runHrZoneOf(s)==='zeerintensief';
  if(s.date===today){ const rd = runReadiness(today).shown; if(rd==='red') return 'rood'; if(zi && rd!=='green') return 'zeer'; return ''; }
  return zi ? 'zeer' : '';
}
async function coachSyncAll(manual){
  if(!coachConnected()){ if(manual) runMsg('Verbind eerst met Intervals.icu.', 'err'); return 0; }
  if(RUI.coachBusy) return 0;
  const today = todayISO(), list = RP().sessions.filter(s=> s.status==='planned' && s.date>=today && coachState(s)!=='sent' && (manual || !coachHold(s)));
  if(!list.length){ if(manual){ runMsg('Alles staat al in Garmin.'); coachRerender(); } return 0; }
  const c = coachSet(); RUI.coachBusy = 'all'; if(manual) coachRerender();
  try {
    const res = await coachCall({ action:'upsert', events:list.map(s=>coachPayload(s, 'text')) });
    const ids = new Map((res.events||[]).map(e=>[e.external_id, e.id]));
    list.forEach(s=>{ const extId = coachExtId(s), prev = coachInfo(s) || {};
      s.ext = s.ext || {}; s.ext.intervals = { externalId:extId, eventId: ids.get(extId) ?? prev.eventId ?? null, syncedAt:runNow(), status:'sent', error:null, hash:coachHash(s), variant:'text' }; });
    c.lastOkAt = runNow(); c.lastError = null;
    runMsg(list.length===1 ? '1 training gesynchroniseerd met Garmin.' : list.length+' trainingen gesynchroniseerd met Garmin.');
  } catch(e){
    list.forEach(s=>{ const prev = coachInfo(s) || {}; s.ext = s.ext || {}; s.ext.intervals = { ...prev, externalId:coachExtId(s), status:'error', error:e.message, failedAt:runNow() }; });
    c.lastError = e.message; runMsg('Sync met Garmin mislukt: '+e.message+' — je trainingen staan gewoon in Atempo.', 'err');
  } finally { RUI.coachBusy = null; coachRerender(); }
  return list.length;
}
const coachSyncChanged = () => coachSyncAll(false);
function coachAct(act, args){
  const s = args[0] ? runSes(args[0]) : null;
  if(['coachSend','coachRemove','coachRuns'].includes(act) && !coachConnected())
    return runMsg('Verbind eerst met Intervals.icu met de knop Verbinden met Intervals.icu.', 'err');
  switch(act){
    case 'coachSend': {
      if(!s || s.status!=='planned') return runMsg('Alleen een geplande training kun je naar Garmin sturen.', 'err');
      const rd = runReadiness(todayISO());
      if(s.date <= addDays(todayISO(),1) && rd.shown==='red' && !confirm('Je herstelstatus is rood: '+runStatusHeadline(rd)+'\n\nToch naar Garmin sturen? Jij beslist.')) return;
      coachSend(s); return;
    }
    case 'coachRemove': { const i = coachInfo(s); if(i) coachRemove(i.externalId, s); return; }
    case 'coachConnect': coachConnect(); return;
    case 'coachSync': if(coachConnected()) coachSyncAll(true); else coachConnect(); return;
    case 'coachRuns': RUI.coachBusy = 'runs'; coachRerender(); coachFetchRuns(false).finally(()=>{ RUI.coachBusy = null; coachRerender(); }); return;
    case 'coachDisconnect': if(confirm('Verbinding met Intervals.icu verbreken? Je kunt later opnieuw verbinden.')) coachDisconnect(); return;
  }
}

/* ---------- weergave ---------- */
function coachPill(s){

  return ` <span class="pill ${st==='sent'?'done':st==='error'?'warn':''}">${st==='sent'?'✓ Garmin':st==='changed'?'Garmin: gewijzigd':'Garmin: fout'}</span>`;
}
/* Garmin bij één training: alleen de stand (synchroniseren gaat vanzelf of met Sync met Garmin in de kalender) */
function coachLineHTML(s){

  const st = coachState(s), i = coachInfo(s);

  if(st==='error') return `<div class="run-g"><span class="warnline" style="margin:0">Sync met Garmin mislukt: ${esc(i.error||'onbekende fout')}</span>${runBtn('coachSync','Opnieuw','sm')}</div>`;
  if(RUI.coachBusy) return '<div class="run-g"><span class="tny muted">Bezig met synchroniseren…</span></div>';

}
function coachSettingsHTML(){
  const c = coachSet(), con = coachConnected(), busy = RUI.coachBusy==='runs';
  const when = x => x ? esc(new Date(x).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})) : '—';

  return `<h3>Garmin via Intervals.icu</h3>${RUI.msg?`<div class="run-msg ${RUI.msgKind==='err'?'err':''}">${esc(RUI.msg)}</div>`:''}
    <div class="week-track">
      <div class="row"><span class="k">Verbinding</span><span class="v ${con?'ok':'na'}">${conTxt}</span></div>

      ${c.needActivityScope ? `<div class="warnline">Atempo mag nog niet al je gegevens lezen. Klik op Verbinding verbreken en daarna op Verbinden met Intervals.icu, en geef toestemming voor activiteiten en dagwaarden.</div>` : ''}
    </div>
    <div class="run-actions">${busy ? '<span class="tny muted">Bezig…</span>' : con ? runBtn('coachRuns','Nu ophalen','sm primary')+runBtn('coachDisconnect','Verbinding verbreken','sm') : coachCanConnect() ? runBtn('coachConnect','Verbinden met Intervals.icu','sm primary') : ''}</div>
    <p class="tny muted">Je geplande trainingen gaan vanzelf naar Garmin (Sync met Garmin). Je runs en dagwaarden (HRV, rustpols, slaap, gewicht, VO₂-max) worden bij het openen vanzelf opgehaald.</p>
    <details class="acc" style="margin-top:10px"><summary>Reserve: trainingen via de kabel (FIT-bestanden)</summary><div class="acc-body">
      <p class="tny muted">Alleen nodig als de draadloze route via Intervals.icu niet werkt.</p>
      <div class="run-actions">${runBtn('exportAllLevels','Alle niveaus (A–H) als zip','sm')}</div>
      <details class="acc"><summary>Uitleg: .fit-bestanden via de kabel op je horloge zetten</summary><div class="acc-body"><ol class="small run-ol"><li>Pak de zip uit (rechtermuisknop › Alles uitpakken). Sluit je Forerunner 165 met de kabel aan op je computer.</li><li>Open het horloge in de Verkenner › map <b>GARMIN</b> › <b>NewFiles</b> (bestaat die niet: probeer de map <b>Workouts</b>).</li><li>Kopieer het .fit-bestand (of bij de zip: alle bestanden — begin desnoods met alleen <b>Niveau_A.fit</b> als test) erin, werp het horloge veilig uit en koppel los. Het horloge verplaatst de bestanden zelf naar <b>Workouts</b>; start het zo nodig opnieuw op.</li><li>Op het horloge: <b>START</b> › <b>Hardlopen</b> › houd <b>UP</b> ingedrukt › <b>Training</b> › <b>Workouts</b> (of <b>Mijn workouts</b>) — daar staan Niveau A t/m H.</li></ol><div class="tny muted">Dit is de route die gebruikers voor veel Garmin-modellen beschrijven; Garmin zelf publiceert deze stappen niet per model. Naam wordt op sommige horloges na 15 tekens afgekapt.</div></div></details>
    </div></details>`;
}

{ const bt = $('#buildTag'); if(bt) bt.textContent = `${APP_VERSION} (${APP_BUILD}) · geladen ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`; }
/* computer: opslagstatus en versie onderaan de zijbalk, in de bergen; telefoon: onder de paginatitel */
{ const mq = window.matchMedia('(min-width:861px)');
  const place = () => { const to = mq.matches ? $('#sideStatus') : $('#topTitle'); ['#saveState','#buildTag'].forEach(s=>{ const el = $(s); if(el && to && el.parentNode!==to) to.appendChild(el); }); };
  place(); if(mq.addEventListener) mq.addEventListener('change', place); }
ui.weekIdx = Math.max(0, weekIndexFor(ui.date));
if(!(typeof syncLoggedIn==='function' && syncLoggedIn()) && fixOldRunsAsLevelA()) saveState();
renderCurrent();
bkInit();
syncFootUpdate();
syncNow();
