/* ===========================================================================
   HARDLOPEN — deel 2: Garmin FIT Workout-bestand (gestructureerde training)
   Bouwt een FIT-bestand van het type "workout" volgens de Garmin FIT-specificatie (profiel 21.218):
     file_id (mesg 0, type=5 workout) · workout (mesg 26, sport=running) · workout_step (mesg 27, per stap)
   Elke stap van de training wordt een eigen workout_step (volledig uitgeschreven, géén herhaalstappen), met oplopende
   message_index, naam, tijdsduur, intensiteit en een optioneel trainingsdoel. De duur is altijd tijd: een doel
   (hartslag of tempo) is alleen een richtwaarde en bepaalt nooit wanneer de volgende stap begint.
   Een bestand wordt ALLEEN aangeboden als de ingebouwde controle (fitVerify) slaagt:
   kop-CRC, bestands-CRC, berichtstructuur, aantal stappen, namen, duur, intensiteit, doel en totale duur.
   Aanvullend is het encoderontwerp offline getest tegen de officiële Garmin FIT SDK (zie controleverslag).
   =========================================================================== */
const FIT_PROFILE = 21218;            // 21.218
const FIT_EPOCH_OFFSET = 631065600;   // seconden tussen 1970-01-01 en 1989-12-31
const FIT_MSG = { fileId:0, workout:26, workoutStep:27 };
const FIT_INT = { active:0, rest:1, warmup:2, cooldown:3, recovery:4, interval:5 };
const FIT_DUR = { time:0, repeatUntilStepsCmplt:6 };
const FIT_TGT = { speed:0, heartRate:1, open:2 };
const FIT_TYPE = { enum:0x00, uint8:0x02, string:0x07, uint16:0x84, uint32:0x86, uint32z:0x8C };
const FIT_INVALID32 = 0xFFFFFFFF;
const FIT_CRC_TAB = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function fitCrcByte(crc, b){
  let t = FIT_CRC_TAB[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC_TAB[b & 0xF];
  t = FIT_CRC_TAB[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC_TAB[(b >> 4) & 0xF];
  return crc;
}
function fitCrc(bytes, from, to){ let c = 0; for(let i=from;i<to;i++) c = fitCrcByte(c, bytes[i]); return c; }
function fitAscii(str, max){            // alleen veilige ASCII, zodat elk horloge de naam kan tonen
  const s = String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[–—]/g,'-').replace(/×/g,'x').replace(/[^\x20-\x7E]/g,'');
  return s.slice(0, max);
}
const FIT_STR = 16;                      // vaste stringlengte (inclusief afsluitende nul) voor namen

/* velddefinities (veldnummer, grootte, basistype) — vast per berichtsoort */
const FIT_DEF = {
  fileId:      { num:FIT_MSG.fileId,      fields:[ [0,1,FIT_TYPE.enum], [1,2,FIT_TYPE.uint16], [2,2,FIT_TYPE.uint16], [3,4,FIT_TYPE.uint32z], [4,4,FIT_TYPE.uint32] ] },
  workout:     { num:FIT_MSG.workout,     fields:[ [4,1,FIT_TYPE.enum], [6,2,FIT_TYPE.uint16], [8,FIT_STR,FIT_TYPE.string] ] },
  workoutStep: { num:FIT_MSG.workoutStep, fields:[ [254,2,FIT_TYPE.uint16], [0,FIT_STR,FIT_TYPE.string], [1,1,FIT_TYPE.enum], [2,4,FIT_TYPE.uint32], [3,1,FIT_TYPE.enum], [4,4,FIT_TYPE.uint32], [5,4,FIT_TYPE.uint32], [6,4,FIT_TYPE.uint32], [7,1,FIT_TYPE.enum] ] },
};

/* trainingsdoel -> FIT-velden (Garmin FIT-profiel, workout_step):
     geen doel  : target_type=open(2), target_value=0, custom low/high ongeldig (geen willekeurige standaardwaarde)
     hartslag   : target_type=heart_rate(1), target_value=0 (= eigen bereik), custom low/high = bpm + 100
     tempo      : target_type=speed(0), target_value=0, custom low/high = snelheid in mm/s (m/s × 1000);
                  langzaamste tempo = laagste snelheid, dus min/max worden bij het omrekenen omgedraaid
   Atempo-vorm (dezelfde als het bestaande trainingsdoel): { type:'none' } · { type:'hr', low, high } in bpm ·
   { type:'pace', low, high } in seconden per km. Volgorde van low/high mag willekeurig zijn; die wordt hier rechtgezet. */
const FIT_OPEN = { targetType:FIT_TGT.open, targetValue:0, low:FIT_INVALID32, high:FIT_INVALID32 };
function fitTarget(tg){
  const a = num(tg && tg.low), b = num(tg && tg.high);
  if(!tg || !(a>0) || !(b>0)) return { ...FIT_OPEN };
  if(tg.type==='hr' && Math.max(a,b)<=255) return { targetType:FIT_TGT.heartRate, targetValue:0, low:Math.round(Math.min(a,b))+100, high:Math.round(Math.max(a,b))+100 };
  if(tg.type==='pace') return { targetType:FIT_TGT.speed, targetValue:0, low:Math.round(1e6/Math.max(a,b)), high:Math.round(1e6/Math.min(a,b)) };
  return { ...FIT_OPEN };
}
/* doel van één stap: een eigen doel van de stap (st.target, ook expliciet 'none') gaat voor; anders geldt het
   bestaande trainingsdoel van de training alleen voor de hardloopstappen; anders geen doel */
const fitStepTarget = (s, st) => fitTarget(st.target ? st.target : (st.t==='run' ? s.target : null));
const FIT_INT_OF = { warmup:FIT_INT.warmup, run:FIT_INT.active, walk:FIT_INT.recovery, cooldown:FIT_INT.cooldown };
/* training -> FIT-stappen: elke stap apart en in volgorde (geen herhaalstappen; Garmin gaat na de tijd vanzelf door) */
function fitStepsFromSession(s){
  return (s.steps||[]).map(st=>({ name:RUN_STEP[st.t].garmin, durationType:FIT_DUR.time, durationValue:Math.round(st.sec*1000),
    ...fitStepTarget(s, st), intensity:FIT_INT_OF[st.t] }));
}

function fitWorkoutName(s){
  if(s.fitName) return fitAscii(s.fitName, 15);
  const t = runTpl(s.templateId); const base = (t ? t.id : 'Run') + ' ' + (s.date||'').slice(5).replace('-','/');
  return fitAscii('Run ' + base, 15);
}

/* minimale FIT-schrijver (little-endian, één definitie per berichtsoort) */
function fitBuildWorkout(s, nowSec, salt){
  salt = salt || 0;
  const steps = fitStepsFromSession(s);
  const body = [];
  const u8 = v => body.push(v & 0xFF), u16 = v => { body.push(v & 0xFF, (v>>8) & 0xFF); },
        u32 = v => { v = v>>>0; body.push(v & 0xFF, (v>>>8) & 0xFF, (v>>>16) & 0xFF, (v>>>24) & 0xFF); };
  const str = v => { const a = []; for(const ch of String(v)) a.push(ch.charCodeAt(0)&0x7F); while(a.length<FIT_STR) a.push(0); a.length = FIT_STR; a[FIT_STR-1] = 0; body.push(...a); };
  const defMsg = (local, def) => { u8(0x40 | local); u8(0); u8(0); u16(def.num); u8(def.fields.length); def.fields.forEach(([n,sz,bt])=>{ u8(n); u8(sz); u8(bt); }); };
  const created = (nowSec ?? Math.floor(Date.now()/1000)) - FIT_EPOCH_OFFSET + salt;
  defMsg(0, FIT_DEF.fileId);
  u8(0x00); u8(5); u16(255); u16(0); u32((((created ^ 0x5A5A5A5A) + salt*7919)>>>0) || 1); u32(created);         // type=workout, manufacturer=development
  defMsg(1, FIT_DEF.workout);
  u8(0x01); u8(1); u16(steps.length); str(fitWorkoutName(s));                                         // sport=running
  defMsg(2, FIT_DEF.workoutStep);
  steps.forEach((st,i)=>{
    u8(0x02); u16(i); str(fitAscii(st.name, FIT_STR-1)); u8(st.durationType); u32(st.durationValue);
    u8(st.targetType); u32(st.targetValue); u32(st.low); u32(st.high); u8(st.intensity);
  });
  const dataSize = body.length, header = [14, 0x20, FIT_PROFILE & 0xFF, (FIT_PROFILE>>8) & 0xFF, dataSize & 0xFF, (dataSize>>8) & 0xFF, (dataSize>>16) & 0xFF, (dataSize>>>24) & 0xFF, 0x2E, 0x46, 0x49, 0x54];
  const hc = fitCrc(header, 0, 12); header.push(hc & 0xFF, (hc>>8) & 0xFF);
  const all = new Uint8Array(header.length + body.length + 2); all.set(header,0); all.set(body, header.length);
  const fc = fitCrc(all, 0, all.length-2); all[all.length-2] = fc & 0xFF; all[all.length-1] = (fc>>8) & 0xFF;
  return all;
}

/* ---------- onafhankelijke controle van het gegenereerde bestand (eigen parser) ---------- */
function fitVerify(bytes, s){
  const err = [];
  const rd16 = (o) => bytes[o] | (bytes[o+1]<<8), rd32 = (o) => (bytes[o] | (bytes[o+1]<<8) | (bytes[o+2]<<16) | (bytes[o+3]<<24)) >>> 0;
  if(bytes.length < 16) return { ok:false, errors:['Bestand te klein'] };
  if(bytes[0]!==14) err.push('Kopgrootte is niet 14');
  if(String.fromCharCode(bytes[8],bytes[9],bytes[10],bytes[11])!=='.FIT') err.push('Kop mist ".FIT"');
  if(fitCrc(bytes,0,12)!==rd16(12)) err.push('Kop-CRC klopt niet');
  const dataSize = rd32(4);
  if(14 + dataSize + 2 !== bytes.length) err.push('Datagrootte in de kop klopt niet met de bestandsgrootte');
  if(fitCrc(bytes,0,bytes.length-2)!==rd16(bytes.length-2)) err.push('Bestands-CRC klopt niet');
  // berichten lezen
  const defs = {}; let o = 14; const msgs = [];
  while(o < 14+dataSize && !err.length){
    const h = bytes[o++];
    if(h & 0x40){                                                    // definitiebericht
      const local = h & 0x0F; if(bytes[o+1]!==0){ err.push('Alleen little-endian bestanden verwacht'); break; }
      const gnum = rd16(o+2), nf = bytes[o+4]; const f = []; let size = 0;
      for(let i=0;i<nf;i++){ f.push({ n:bytes[o+5+3*i], sz:bytes[o+6+3*i], bt:bytes[o+7+3*i] }); size += bytes[o+6+3*i]; }
      defs[local] = { gnum, f, size }; o += 5 + 3*nf;
    } else {                                                         // gegevensbericht
      const d = defs[h & 0x0F]; if(!d){ err.push('Gegevensbericht zonder definitie'); break; }
      const rec = { gnum:d.gnum }; let p = o;
      for(const fl of d.f){
        if(fl.bt===FIT_TYPE.string){ let t=''; for(let i=0;i<fl.sz && bytes[p+i];i++) t += String.fromCharCode(bytes[p+i]); rec[fl.n] = t; }
        else if(fl.sz===1) rec[fl.n] = bytes[p]; else if(fl.sz===2) rec[fl.n] = rd16(p); else if(fl.sz===4) rec[fl.n] = rd32(p);
        p += fl.sz;
      }
      msgs.push(rec); o += d.size;
    }
  }
  if(!err.length && o !== 14+dataSize) err.push('Berichten sluiten niet exact aan op de datagrootte');
  if(!err.length){
    const fid = msgs.filter(m=>m.gnum===FIT_MSG.fileId), wk = msgs.filter(m=>m.gnum===FIT_MSG.workout), st = msgs.filter(m=>m.gnum===FIT_MSG.workoutStep);
    const exp = fitStepsFromSession(s);
    if(fid.length!==1 || fid[0][0]!==5) err.push('file_id: type moet "workout" (5) zijn');
    if(wk.length!==1) err.push('Er moet precies één workout-bericht zijn'); else {
      if(wk[0][4]!==1) err.push('sport moet hardlopen (1) zijn');
      if(wk[0][6]!==exp.length) err.push('num_valid_steps ('+wk[0][6]+') klopt niet met het aantal stappen ('+exp.length+')');
      if(!wk[0][8]) err.push('Workout heeft geen naam');
    }
    if(st.length!==exp.length) err.push('Aantal stap-berichten ('+st.length+') klopt niet met verwacht ('+exp.length+')');
    else if(st.length!==(s.steps||[]).length) err.push('Aantal stappen ('+st.length+') klopt niet met de training ('+(s.steps||[]).length+')');
    else st.forEach((m,i)=>{
      const e = exp[i];
      if(m[254]!==i) err.push('Stap '+i+': message_index klopt niet');
      if(m[1]===FIT_DUR.repeatUntilStepsCmplt) err.push('Stap '+i+': herhaalstap gevonden (niet toegestaan)');
      if(m[1]!==FIT_DUR.time) err.push('Stap '+i+': duur-type moet tijd zijn');
      if(m[2]!==e.durationValue>>>0) err.push('Stap '+i+': duur klopt niet');
      if(m[0]!==fitAscii(e.name, FIT_STR-1)) err.push('Stap '+i+': naam klopt niet ('+m[0]+')');
      if(m[7]!==e.intensity) err.push('Stap '+i+': intensiteit klopt niet');
      if(m[3]!==e.targetType || m[4]!==e.targetValue || m[5]!==(e.low>>>0) || m[6]!==(e.high>>>0)) err.push('Stap '+i+': trainingsdoel klopt niet');
    });
    // totale duur uit het bestand moet gelijk zijn aan de duur van de training
    if(!err.length){
      const total = st.reduce((a,m)=>a+m[2]/1000,0), want = (s.steps||[]).reduce((a,x)=>a+x.sec,0);
      if(Math.abs(total-want)>0.5) err.push('Totale duur in bestand ('+total+' s) verschilt van de training ('+want+' s)');
    }
  }
  return { ok:!err.length, errors:err, size:bytes.length };
}
/* hoofdingang: levert alleen een bestand af als de controle slaagt */
function fitExportSession(s){
  if(!s || !s.steps || !s.steps.length) return { ok:false, errors:['Deze training heeft geen stappen.'] };
  const bad = s.steps.find(x=> !(x.sec>0) || !RUN_STEP[x.t]); if(bad) return { ok:false, errors:['Ongeldige stap in de training.'] };
  const bytes = fitBuildWorkout(s), v = fitVerify(bytes, s);
  return v.ok ? { ok:true, bytes, name:fitWorkoutName(s), size:bytes.length } : { ok:false, errors:v.errors };
}

/* ---------- alle niveaus in één keer: .fit per niveau + zip (store, zonder compressie) ---------- */
const FIT_CRC32_TAB = (()=>{ const t = []; for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t.push(c >>> 0); } return t; })();
function fitCrc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = FIT_CRC32_TAB[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function fitZip(files){
  const enc = s => Array.from(s).map(ch=>ch.charCodeAt(0) & 0x7F), out = [], cen = [];
  const u16 = (a,v)=>{ a.push(v & 0xFF, (v>>8) & 0xFF); }, u32 = (a,v)=>{ v = v>>>0; a.push(v & 0xFF, (v>>>8) & 0xFF, (v>>>16) & 0xFF, (v>>>24) & 0xFF); };
  const d = new Date(), dosTime = (d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1), dosDate = ((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate();
  files.forEach(f=>{
    const name = enc(f.name), crc = fitCrc32(f.bytes), off = out.length;
    u32(out,0x04034b50); u16(out,20); u16(out,0); u16(out,0); u16(out,dosTime); u16(out,dosDate); u32(out,crc); u32(out,f.bytes.length); u32(out,f.bytes.length); u16(out,name.length); u16(out,0);
    out.push(...name); for(let i=0;i<f.bytes.length;i++) out.push(f.bytes[i]);
    u32(cen,0x02014b50); u16(cen,20); u16(cen,20); u16(cen,0); u16(cen,0); u16(cen,dosTime); u16(cen,dosDate); u32(cen,crc); u32(cen,f.bytes.length); u32(cen,f.bytes.length);
    u16(cen,name.length); u16(cen,0); u16(cen,0); u16(cen,0); u16(cen,0); u32(cen,0); u32(cen,off); cen.push(...name);
  });
  const cdOff = out.length; out.push(...cen);
  u32(out,0x06054b50); u16(out,0); u16(out,0); u16(out,files.length); u16(out,files.length); u32(out,cen.length); u32(out,cdOff); u16(out,0);
  return Uint8Array.from(out);
}
/* bouwt voor elk niveau een apart workoutbestand (elk door fitVerify gecontroleerd); alles of niets */
/* geplande trainingen van de komende dagen als losse .fit-bestanden (datum in de naam) in één zip — om in Intervals.icu te importeren */
function fitExportPeriod(days, nowSec){
  const today = todayISO(), last = addDays(today, days-1), now = nowSec ?? Math.floor(Date.now()/1000), files = [], errors = [];
  RP().sessions.filter(s=> s.status==='planned' && s.date>=today && s.date<=last).sort(runByDate).forEach((s,i)=>{
    const t = runTpl(s.templateId), label = t ? t.name : s.name, bytes = fitBuildWorkout(s, now, i), v = fitVerify(bytes, s);
    if(v.ok) files.push({ name: s.date + '_' + fitAscii(label, 20).replace(/[^A-Za-z0-9]+/g,'_') + '.fit', bytes, title: runDateShort(s.date) + ' ' + label });
    else errors.push(s.date + ': ' + v.errors.join('; '));
  });
  if(errors.length) return { ok:false, errors };
  if(!files.length) return { ok:false, errors:['Er staan de komende ' + days + ' dagen geen trainingen gepland.'] };
  return { ok:true, files, zip: fitZip(files) };
}
function fitExportAllLevels(nowSec){
  const rp = RP(), now = nowSec ?? Math.floor(Date.now()/1000), files = [], errors = [], used = new Set();
  rp.templates.forEach((t,i)=>{
    let nm = fitAscii(t.name, 15) || ('Niveau '+(i+1)), base = nm, k = 2;
    while(used.has(nm.toLowerCase())){ nm = fitAscii(base, 12) + ' ' + (k++); }
    used.add(nm.toLowerCase());
    const s = { id:'lvl-'+t.id, name:nm, fitName:nm, templateId:t.id, steps:runStepsFromParams(t), target:{ ...(t.target||{ type:'none' }) }, date:'' };
    const bytes = fitBuildWorkout(s, now, i), v = fitVerify(bytes, s);
    if(v.ok) files.push({ name: nm.replace(/[^A-Za-z0-9]+/g,'_') + '.fit', bytes, title:nm });
    else errors.push(nm + ': ' + v.errors.join('; '));
  });
  if(errors.length || !files.length) return { ok:false, errors: errors.length ? errors : ['Geen niveaus om te exporteren.'] };
  return { ok:true, files, zip: fitZip(files) };
}

const RUN_FIT_VALIDATED = true;          // ingebouwde controle (fitVerify) draait bij élke export; zie controleverslag voor de SDK-test

/* ---------- kleine bouwstenen ---------- */
function runTimelineSVG(steps, h){
  const T = runTotals(steps).total || 1, W = 360, H = h || 46; let x = 0, r = '';
  (steps||[]).forEach(s=>{
    const w = s.sec/T*W, c = RUN_STEP[s.t].color, dark = s.t!=='run';
    r += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(w-1,1).toFixed(1)}" height="${H}" rx="3" fill="${c}"><title>${RUN_STEP[s.t].nl} ${runMinLabel(s.sec)}</title></rect>`;
    if(w>=15 && H>=34){
      const sz = w>=22 ? 13 : 11, col = dark ? '#1b3a30' : '#ffffff';
      r += `<svg x="${(x+w/2-sz/2).toFixed(1)}" y="${(H*0.14).toFixed(1)}" width="${sz}" height="${sz}" viewBox="0 0 24 24" style="stroke:${col};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${RUN_SYM_HEAD[s.t]||''}<path d="${RUN_SYM[s.t]}"/></svg>`;
      r += `<text x="${(x+w/2).toFixed(1)}" y="${(H*0.88).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:${col}">${runMinStr(s.sec)}</text>`;
    } else if(w>=15 && H>=24) r += `<text x="${(x+w/2).toFixed(1)}" y="${(H/2+3.5).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:${dark?'#1b3a30':'#ffffff'}">${runMinStr(s.sec)}</text>`;
    x += w;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="run-tl" role="img" aria-label="Tijdlijn van de training">${r}</svg>`;
}
const runLegend = () => `<div class="run-legend">${['warmup','run','walk','cooldown'].map(t=>`<span><i style="background:${RUN_STEP[t].color}"></i>${runSymSVG(t,13,'#6b7872')} ${RUN_STEP[t].nl}</span>`).join('')}</div>`;
function runTotalsLine(steps){
  const T = runTotals(steps);
  return `<div class="run-totals"><b>${runMinLabel(T.total)}</b> totaal · hardlopen <b>${runMinLabel(T.run)}</b> · wandelen <b>${runMinLabel(T.walk)}</b> <span class="tny muted">(waarvan opwarmen/afkoelen ${runMinLabel(T.warm+T.cool)})</span> · <b>${T.intervals}</b> ${T.intervals===1?'blok':'intervallen'}</div>`;
}
function runInp(label, path, val, o){
  o = o || {};
  const ph = o.ph ? ` placeholder="${esc(o.ph)}"` : '';
  return `<div class="field"><label>${esc(label)}</label><input type="${o.type||'text'}" ${o.inputmode?`inputmode="${o.inputmode}"`:''} data-bind="${path}" value="${val==null?'':esc(val)}"${ph}${o.min!=null?` min="${o.min}"`:''}${o.max!=null?` max="${o.max}"`:''}></div>`;
}
function runSel(label, path, val, opts){
  return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
}
const runNumOpts = (a,b,empty) => [['', empty||'—'], ...Array.from({length:b-a+1},(_,i)=>[String(a+i), String(a+i)])];
const runYesNo = [['','—'],['ja','ja'],['nee','nee']];
const runBtn = (act, label, cls, extra) => `<button class="btn ${cls||''}" data-run-act="${esc(act)}"${extra||''}>${label}</button>`;
function runStatusPill(s){
  const cls = s.status==='done' ? 'done' : s.status==='planned' ? 'priority' : 'warn';
  return `<span class="pill ${cls}">${RUN_STATUS_NL[s.status]||s.status}</span>`;
}
function runDateLabel(d){ return fmt(d,{weekday:'long',day:'numeric',month:'long'}); }
function runDateShort(d){ return fmt(d,{weekday:'short',day:'numeric',month:'short'}); }

  watch: '<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 10v2.5l1.5 1"/>',

function renderRunning(){

/* compacte Garmin-status: een melding van zojuist, anders de opgeslagen stand van de geplande trainingen.
   Alleen 'In Garmin' als de opgeslagen stand dat bevestigt; het openen van de pagina start geen synchronisatie. */
function runSyncBar(){
  const bar = (cls, ico, txt, ok) => `<div class="rv-bar ${cls}" role="status">${TD_ICO(ico,'rv-bar-ico')}<span>${esc(txt)}</span>${ok ? TD_ICO(RUN_ICO.tick,'rv-bar-ok') : ''}</div>`;
  if(RUI.msg) return RUI.msgKind==='err' ? bar('err', RUN_ICO.info, RUI.msg) : bar('', /garmin/i.test(RUI.msg) ? RUN_ICO.watch : RUN_ICO.info, RUI.msg, /garmin/i.test(RUI.msg));
  if(RUI.coachBusy) return bar('busy', RUN_ICO.watch, 'Bezig met synchroniseren met Garmin…');
  const today = todayISO(), up = RP().settings.paused ? [] : RP().sessions.filter(s=> s.status==='planned' && s.date>=today);
  const st = up.map(coachState), sent = st.filter(x=>x==='sent').length, err = st.filter(x=>x==='error').length, open = up.length - sent - err;
  if(!up.length || (!sent && !err && !coachConnected())) return '';                  // niets gepland of geen koppeling: geen balk
  if(err) return bar('err', RUN_ICO.watch, err===1 ? 'Synchroniseren met Garmin is mislukt voor 1 training.' : 'Synchroniseren met Garmin is mislukt voor '+err+' trainingen.');
  if(open) return bar('wait', RUN_ICO.watch, open===1 ? '1 training staat nog niet in Garmin.' : open+' trainingen staan nog niet in Garmin.');
  return bar('', RUN_ICO.watch, sent===1 ? 'De geplande training staat in Garmin.' : 'Alle '+sent+' geplande trainingen staan in Garmin.', true);
}
function renderProgram(){
  RUI.tab = 'program';

    <p class="small muted">Alles wat gepland staat: hardlopen, kracht en routines.</p></div>`;
  if(RUI.msg) html += `<div class="run-msg ${RUI.msgKind==='err'?'err':''}">${esc(RUI.msg)}</div>`;
  html += runViewProgram();
  setViewHTML('#view-program', html);
  if(RUI.scrollTo){ const el = document.getElementById('run-'+RUI.scrollTo) || document.getElementById(RUI.scrollTo); RUI.scrollTo = null; if(el) setTimeout(()=>el.scrollIntoView({ block:'center', behavior:'smooth' }), 30); }
}

/* ---------- resultaat van één training ---------- */
const runTime = a => a && a.startTime ? new Date(a.startTime).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '';
function runResultLine(s){
  const a = runActivity(s.garminExternalId), r = runResultOf(s);
  if(a) return `✓ ${[a.distanceKm!=null?nl(a.distanceKm)+' km':'', a.durationMin!=null?nl(round(a.durationMin,1))+' min':'', a.avgPace?esc(a.avgPace)+' /km':'', a.avgHr!=null?'hartslag '+a.avgHr:''].filter(Boolean).join(' · ')}`;
  if(s.garminExternalId) return 'De gekoppelde run staat niet (meer) in je gegevens.';
  return '✓ Gedaan zonder Garmin' + (r && r.durationMin ? ' · '+nl(r.durationMin)+' min' : '') + (r && r.distanceKm ? ' · '+nl(r.distanceKm)+' km' : '');
}
/* een geplande training op of na de dag zelf: run koppelen, zonder Garmin afronden of overgeslagen */
function runResultButtons(s){
  const c = runCandidates(s.date);
  return c.map(a=>runBtn('link|'+s.id+'|'+a.externalId, `Koppel run ${esc(runTime(a))} · ${a.distanceKm!=null?nl(a.distanceKm)+' km':'?'}`, 'primary sm')).join('')

}
/* snelle velden voor één training (gaan meteen in, zonder aparte knop) */
function runQ(s){
  RUI.q = RUI.q || {};
  if(!RUI.q[s.id]){
    const runs = s.steps.filter(x=>x.t==='run'), walks = s.steps.filter(x=>x.t==='walk');
    RUI.q[s.id] = { warm:runMinStr(s.steps.find(x=>x.t==='warmup')?.sec||0), reps:String(runs.length||1), run:runMinStr(runs[0]?.sec||180), walk:runMinStr(walks[0]?.sec||0), cool:runMinStr(s.steps.find(x=>x.t==='cooldown')?.sec||0) };
  }
  return RUI.q[s.id];
}
function runEditHTML(s){
  const q = runQ(s), qb = '__run.q.'+s.id+'.';
  return `<div class="run-edit">
    <div class="form-grid cols-5">
      ${runInp('Opwarmen (min)', qb+'warm', q.warm, { inputmode:'decimal' })}
      ${runInp('Intervallen', qb+'reps', q.reps, { type:'number', inputmode:'numeric', min:1, max:50 })}
      ${runInp('Hardlopen (min)', qb+'run', q.run, { inputmode:'decimal', ph:'3 of 3:30' })}
      ${runInp('Wandelen (min)', qb+'walk', q.walk, { inputmode:'decimal', ph:'0 = geen' })}
      ${runInp('Afkoelen (min)', qb+'cool', q.cool, { inputmode:'decimal' })}
    </div>
    <div class="tny muted">Een wijziging telt meteen${coachState(s)!=='local' ? ' en gaat vanzelf mee naar Garmin' : ''}. Het niveau zelf blijft zoals het is.</div>

    ${runInp('Notitie', '__run.ses.'+s.id+'.notes', s.notes, { ph:'optioneel' })}
    <div class="run-actions">${runBtn('close|'+s.id,'Klaar','sm primary')}</div></div>`;
}
/* intensiteit (hartslagdoel) van één training: één keuzelijst met het bereik ernaast */
const runBpm = t => t && t.type==='hr' ? t.low+'–'+t.high+' bpm' : '';
function runHrLine(s){
  const z = runHrZoneOf(s), b = '__run.ses.'+s.id+'.';
  if(s.status!=='planned') return z ? `<div class="small run-hr"><b>Intensiteit:</b> ${esc(runHrZone(z)[1])} · ${runBpm(s.target)}</div>` : '';
  const opts = [['','Geen hartslagdoel'], ...RUN_HR_ZONES.map(x=>[x[0], x[1]])];
  let h = `<div class="run-hr"><label class="run-hr-pick">Intensiteit <select data-bind="${b}zone">${opts.map(([v,t])=>`<option value="${v}" ${v===(RUI.hrAsk===s.id ? RUI.hrAskZone : z)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`
    + (z ? `<b class="run-hr-bpm">${runBpm(s.target)}</b>` : '') + `</div>`;
  if(RUI.hrAsk===s.id) h += `<div class="run-hr-ask">${runInp('Je leeftijd (één keer invullen)', '__run.set.hrAge', '', { type:'number', inputmode:'numeric', min:RUN_HR_AGE[0], max:RUN_HR_AGE[1], ph:'bijv. 45' })}<div class="tny muted">Daarmee berekent Atempo je hartslagbereik. Aanpassen kan later bij Instellingen.</div></div>`;
  if(z==='zeerintensief') h += `<div class="warnline">Zeer intensief is een zeer zware belasting. Kies dit alleen als je dit gewend bent en goed hersteld bent.</div>`;
  if(z && runHrHeavy(z) && s.date===todayISO()){
    const rd = runReadiness(s.date).shown;
    if(rd==='red') h += `<div class="warnline">Je herstel is vandaag rood: liever niet hardlopen, zeker niet ${esc(runHrZone(z)[1].toLowerCase())}.</div>`;
    else if(rd==='orange') h += `<div class="warnline">Je herstel is vandaag oranje. Rustiger is verstandig. ${runBtn('hrCalm|'+s.id,'Maak het Rustig','sm')}</div>`;
  }
  return h;
}
/* alles van één training, onder de training in de kalender */
function runSessionDetail(s){
  const today = todayISO(), b = '__run.ses.'+s.id+'.';
  let h = runTimelineSVG(s.steps, 30) + runTotalsLine(s.steps);
  if(s.status==='planned'){
    h += runRestWarnings(s).map(w=>`<div class="warnline">${esc(w)}</div>`).join('');
    h += runHrLine(s);
    h += coachLineHTML(s);
    if(s.date<=today) h += `<div class="run-sub">Hoe ging het?</div><div class="run-actions">${runResultButtons(s)}</div>`;
    const editing = RUI.editId===s.id;
    h += `<div class="run-actions">
        <label class="run-move">Verzetten <input type="date" data-bind="${b}date" value="${esc(s.date)}"></label>
        ${editing ? '' : runBtn('editToggle|'+s.id, 'Aanpassen', 'sm')}${runBtn('del|'+s.id,'Verwijderen','sm danger')}${editing ? '' : runBtn('close|'+s.id,'Klaar','sm primary run-close')}</div>`;
    if(editing) h += runEditHTML(s);
  } else if(s.status==='done'){
    h += runHrLine(s) + `<div class="small run-res">${runResultLine(s)}</div><div class="run-sub">Na de training</div>${runPostForm(s)}`;
    h += `<div class="small"><b>Beoordeling:</b> ${esc(runOutcome(s).text)}</div>`;
    if(!s.garminExternalId) h += `<div class="form-grid cols-2">${runInp('Duur (min)', b+'manDuration', s.manual && s.manual.durationMin, { type:'number', inputmode:'decimal' })}${runInp('Afstand (km)', b+'manDistance', s.manual && s.manual.distanceKm, { type:'number', inputmode:'decimal' })}</div>`;
    h += `<div class="run-actions">${runBtn('undo|'+s.id,'Ongedaan maken','sm')}${runBtn('close|'+s.id,'Klaar','sm primary run-close')}</div>`;
  } else {
    h += `<div class="run-actions">${runBtn('undo|'+s.id,'Ongedaan maken','sm')}${runBtn('del|'+s.id,'Verwijderen','sm danger')}${runBtn('close|'+s.id,'Klaar','sm primary run-close')}</div>`;
  }
  return h;
}
/* Garmin-runs van de laatste 2 weken die nog bij geen training horen */
function runLooseActivities(){
  const today = todayISO(), linked = runLinkedMap(), legacy = new Set((CB.coachRuns||[]).map(r=>r.garminExternalId).filter(Boolean));
  return (state.garmin.activities||[]).filter(a=> runIsRunActivity(a) && !linked[a.externalId] && !legacy.has(a.externalId) && a.date>=addDays(today,-14) && a.date<=today)
    .sort((x,y)=>(y.startTime||y.date).localeCompare(x.startTime||x.date)).slice(0,6);
}

/* waar de status vandaan komt: de waarden uit je Dagcheck, je eigen beoordeling en je vorige training */
function runStatusSources(rd, pre){
  const oc = [];
  if(pre){
    if(num(pre.energy)!=null) oc.push('energie '+pre.energy);
    if(num(pre.painLeft)!=null) oc.push(pre.painLeft>0 ? (pre.painWord||'pijn')+' '+pre.painLeft : 'geen pijn');
    if(typeof pre.painWalking==='boolean') oc.push(pre.painWalking || pre.painStairs ? 'klachten bij wandelen/traplopen' : 'geen klachten bij wandelen/traplopen');
  }
  const ico = { 'Dagcheck vandaag':TDI.cal, 'Vorige training':TDI.run, 'Jouw beoordeling':TDI.heart };
  const row = (k, v) => `<div class="row"><span class="k">${TD_ICO(ico[k.replace(/ \(.*$/,'')] || TDI.check,'rv-row-ico')}${k}</span><span class="v" style="white-space:normal;font-weight:500">${v}</span></div>`;
  let h = row('Dagcheck vandaag', (oc.length ? esc(oc.join(' · ')) : 'nog niet ingevuld') + ' <a href="#" data-oc-open class="tny">aanpassen</a>');
  if(rd.own) h += row('Jouw beoordeling (Vandaag)', RUN_LIGHT[rd.own].emoji+' '+esc(RUN_LIGHT[rd.own].nl.toLowerCase())+(rd.ownMilder ? ' <span class="tny muted">— die wijkt af van de automatische waarschuwing; de waarschuwing blijft staan.</span>' : ''));
  if(rd.last){
    const ago = Math.round((parseDate(todayISO())-parseDate(rd.last.date))/86400000);
    h += row('Vorige training ('+esc(runDateShort(rd.last.date))+')', esc(runOutcome(rd.last).text.replace(/\.$/,'')) + (ago>1 ? ` <span class="tny muted">· ${ago} dagen geleden</span>` : ''));
  } else h += row('Vorige training', 'nog geen');
  return `<div class="week-track small run-src">${h}</div>`;
}

/* ---------- OVERZICHT: alleen wat nu nodig is ---------- */
function runViewOverview(){
  const rp = RP(), today = todayISO(); let h = '';
  if(rp.settings.paused) h += `<div class="warnline">⏸ Programma gepauzeerd${rp.settings.pausedFrom?' sinds '+esc(fmt(rp.settings.pausedFrom,{day:'numeric',month:'long'})):''}. ${runBtn('resume','Hervatten','sm')}</div>`;

  /* vragen na de training, tot ze ingevuld zijn */
  const needPost = runDoneSessions().filter(s=> s.date>=addDays(today,-7) && !runPostComplete(s.post)).pop();
  if(needPost) h += `<div class="card run-ask"><h3>Hoe ging je training van ${esc(runDateShort(needPost.date))}?</h3>
    <div class="small muted">${esc(needPost.name)} · ${runResultLine(needPost)}</div>${runPostForm(needPost)}</div>`;

  /* voorbij, nog op gepland en geen run gevonden */
  const od = runOverdue();
  if(od.length) h += `<div class="card"><h3>Nog te verwerken</h3>
    ${od.map(s=>`<div class="run-row"><b>${esc(runDateShort(s.date))}</b> · ${esc(s.name)}<div class="run-actions">${runResultButtons(s)}${runBtn('open|'+s.id,'Verzetten','sm')}</div></div>`).join('')}</div>`;

  /* volgende training */
  const nx = runNextTraining();
  h += `<div class="card run-next rv-next"><div class="rv-next-photo" aria-hidden="true"></div><div class="rv-next-body"><div class="rv-label">Volgende training</div>`;
  if(nx){
    const T = runTotals(nx.steps), when = nx.date===today ? 'Vandaag' : nx.date===addDays(today,1) ? 'Morgen' : runDateLabel(nx.date);
    h += `<div class="run-when">${TD_ICO(TDI.cal)}${esc(when.charAt(0).toUpperCase()+when.slice(1))}</div>
      <div class="rv-title"><b class="run-big">${esc(nx.name)}</b> <span class="rv-meta">· ${runMinLabel(T.total)} · ${esc(runShortStructure(nx.steps))}</span></div>
      <div class="rv-tl">${runTimelineSVG(nx.steps, 40)}</div>
      ${runRestWarnings(nx).map(w=>`<div class="warnline">${esc(w)}</div>`).join('')}
      <div class="rv-next-foot">${coachLineHTML(nx)}<div class="run-actions">${runBtn('open|'+nx.id,TD_ICO(TDI.pen)+'Bekijken of aanpassen','primary')}</div></div>`;
  } else {
    const sug = runSuggestionDates(today, 3)[0], lvl = runCurrentTpl();
    h += `<p class="small">Er is geen training gepland.</p>`;
    if(sug) h += `<div class="run-actions big">${runBtn('plan|'+sug+'|'+lvl.id,'Plan '+esc(lvl.name)+' op '+esc(runDateShort(sug)),'primary')}</div>`;
  }
  h += `</div></div>`;

  /* herstelstatus: uit je Dagcheck, je eigen beoordeling op Vandaag en je vorige training */
  const rd = runReadiness(today), st = RUN_LIGHT[rd.shown], pre = runPre(today);
  h += `<div class="card run-status st-${rd.shown}">
    <div class="run-light"><span class="run-bulb rv-dot" role="img" aria-label="${esc(st.nl)}"></span><div><b>${esc(runStatusHeadline(rd))}</b>
      </div></div>
    ${runStatusSources(rd, pre)}
    ${runPreComplete(pre) ? '' : `<div class="run-actions"><button class="btn sm primary" data-oc-open>Dagcheck invullen</button></div>`}
    <details class="acc"><summary>Waarom?</summary><div class="acc-body">
      ${rd.reasons.length?`<ul class="small">${rd.reasons.map(r=>`<li>${esc(r.text)}</li>`).join('')}</ul>`:''}
      ${rd.missing.length?`<div class="tny muted">Ontbrekend: ${rd.missing.map(esc).join('; ')}.</div>`:''}
      ${!rd.reasons.length && !rd.missing.length?'<div class="small muted">Geen aandachtspunten. Groen geldt bij geen pijn, energie boven 5, weinig spierpijn of stijfheid en geen klachten bij wandelen of traplopen.</div>':''}
      <div class="tny muted">Ondersteunend advies, geen medische beoordeling.</div>
    </div></details></div>`;

  /* evaluatie: pas na twee uitgevoerde trainingen */
  const ev = runEvaluation();
  if(ev.doneCount>=2){
    const up = /uitbreiden/i.test(ev.advice), noUp = rd.shown!=='green' || /herstel afwachten|verminderen/i.test(ev.advice);
    h += `<div class="card rv-eval"><div class="rv-eval-head">${TD_ICO(RUN_ICO.clip,'rv-eval-ico')}<h3>Evaluatie</h3></div><div class="rv-eval-body">
      <p class="rv-advice"><b>${esc(ev.advice)}</b></p><ul class="small">${ev.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
      ${up && injuriesActive().length ? `<div class="tny muted">Je hebt een blessure (${esc(injuriesActive().map(x=>x.area.toLowerCase()).join(', '))}). Een beoordeling door een sportfysiotherapeut is verstandig voordat je verder opbouwt.</div>` : ''}
      <div class="small">Huidig niveau: <b>${esc(ev.level.name)}</b>. Jij beslist.</div>
      <div class="run-actions">${runBtn('level|'+ev.level.id+'|handhaven',TD_ICO(RUN_ICO.tick)+'Niveau handhaven',up?'':'primary')}${ev.nextTpl && !noUp?runBtn('level|'+ev.nextTpl.id+'|opbouwen','<span aria-hidden="true">→</span> Naar '+esc(ev.nextTpl.name),up?'primary':'rv-discouraged'):''}${ev.prevTpl?runBtn('level|'+ev.prevTpl.id+'|verlagen','Terug naar '+esc(ev.prevTpl.name),''):''}</div>
      ${ev.nextTpl && noUp ? `<div class="tny rv-advise-no">${TD_ICO(RUN_ICO.info)}Advies: wacht met een hoger niveau tot je herstel groen is en je vorige training goed ging.</div>` : ev.nextTpl && !up ? `<div class="tny rv-advise-no">${TD_ICO(RUN_ICO.info)}Opbouwen naar ${esc(ev.nextTpl.name)} wordt nu afgeraden.</div>` : ''}</div></div>`;
  }

  /* runs die nog bij geen training horen */
  const loose = runLooseActivities();
  if(loose.length) h += `<div class="card"><h3>Runs zonder training</h3>
    ${loose.map(a=>{ const opts = rp.sessions.filter(x=>(x.status==='planned' || (x.status==='done' && !x.garminExternalId)) && Math.abs((parseDate(x.date)-parseDate(a.date))/86400000)<=3).sort(runByDate);
      return `<div class="run-row"><b>${esc(runDateShort(a.date))}</b> ${esc(runTime(a))} · ${a.distanceKm!=null?nl(a.distanceKm)+' km':''}${a.durationMin!=null?' · '+nl(round(a.durationMin,1))+' min':''}
        <div class="run-actions">${opts.map(x=>runBtn('link|'+x.id+'|'+a.externalId,'Hoort bij '+esc(runDateShort(x.date)),'sm')).join('')}${runBtn('addDoneFrom|'+a.externalId,'Voeg toe als training','sm')}</div></div>`; }).join('')}</div>`;
  return h;
}

function runViewProgram(){
  const rp = RP(), today = todayISO(), cur = runCurrentTpl(); let h = '';

  h += `<div class="card"><h3>Kalender</h3><p class="tny muted" style="margin-top:-4px">Hardlopen, kracht en routines per dag. Tip: houd een hardlooptraining vast en sleep hem naar een andere dag.</p>`;
  const ahead = rp.settings.planWeeksAhead || 2, sugg = new Set(runSuggestionDates(addDays(today,-7), ahead+1)), wk0 = runMonday(addDays(today,-7));
  h += `<div class="run-actions" style="margin:0 0 6px">${runBtn('pastToggle', RUI.showPast ? 'Vorige week verbergen' : 'Vorige week tonen', 'sm')}</div>`;

  for(let w=RUI.showPast ? 0 : 1; w<ahead+2; w++){      // vorige week alleen op verzoek

    for(let i=0;i<7;i++){
      const d = addDays(mon,i), ss = runSessionsOn(d), dl = esc(runDateShort(d)), td = d===today ? ' is-today' : '';
      const chips = typeof progDayChips==='function' ? progDayChips(d) : '';      // kracht en lange wandeling: blokjes achter de training
      const rchip = hasRt ? progDayRoutines(d) : '';                                // alle routines van die dag: één blokje in een eigen kolom, vóór hardlopen
      const rcol = hasRt ? `<span class="run-day-r">${rchip}</span>` : '';
      ss.forEach((s, si)=>{
        const T = runTotals(s.steps);
        rows += `<details class="run-day ${s.status}${td}" id="run-${s.id}" data-run-day="${s.id}" data-day="${d}" ${RUI.openId===s.id?'open':''}><summary><span class="run-day-d">${dl}</span>${si===0 ? rcol : hasRt ? '<span class="run-day-r"></span>' : ''}<span class="run-day-b"><b>${esc(s.name.replace(/ – .*/,''))}</b> <span class="tny muted">${runMinLabel(T.total)}<span class="run-struct"> · ${esc(runShortStructure(s.steps))}</span></span>${si===0 && chips ? ` <span class="prog-chips">${chips}</span>` : ''}</span><span class="run-day-s">${s.status==='planned' ? (s.date<today ? '<span class="pill warn">nog verwerken</span>' : '') : runStatusPill(s)}${s.status==='planned' ? coachPill(s) : ''}<span class="run-chev" aria-hidden="true"></span></span></summary>
          <div class="run-day-body">${runSessionDetail(s)}</div></details>`;
      });
      if(!ss.length){
        const canPlan = sugg.has(d) && d>=today;
        rows += `<div class="run-day rest${td} ${chips?'has-chips':''}" data-day="${d}"><span class="run-day-d">${dl}</span>${rcol}<span class="run-day-b">${chips ? `<span class="prog-chips">${chips}</span>` : 'Rustdag'}${canPlan?` <span class="tny muted run-sugg">· voorstel ${esc(cur.name)}</span>`:''}</span><span class="run-day-s">${canPlan?runBtn('plan|'+d+'|'+cur.id,'+ Inplannen','sm'):''}</span></div>`;
      }
    }
    h += `<div class="run-week"><div class="run-week-h">Week ${runIsoWeek(mon)} · ${esc(fmt(mon,{day:'numeric',month:'short'}))} – ${esc(fmt(sun,{day:'numeric',month:'short'}))}</div>${rows}</div>`;
  }
  h += `</div>`;   // run-cal
  const free = runSuggestionDates(today, ahead+1).filter(d=>d>=today).length;
  const toSync = rp.sessions.filter(s=> s.status==='planned' && s.date>=today && coachState(s)!=='sent').length, canSync = coachConnected() || coachCanConnect();
  h += `<div class="run-actions">${free ? runBtn('planAhead','Vul de voorstellen in ('+free+'× '+esc(cur.name)+')','sm primary') : ''}${canSync ? (RUI.coachBusy==='all' ? '<span class="tny muted">Bezig met synchroniseren…</span>' : runBtn('coachSync', 'Sync met Garmin'+(toSync ? ' ('+toSync+')' : ''), 'sm'+(toSync && !free ? ' primary' : ''))) : ''}${rp.settings.paused?runBtn('resume','Hervatten','sm'):runBtn('pause','Pauzeren','sm')}</div></div>`;

  /* instellingen */
  h += `<details class="acc"><summary>Instellingen</summary><div class="acc-body">
    <div class="small"><b>Trainingsdagen</b> <span class="tny muted">(daar komen de voorstellen)</span></div>
    <div class="run-chips">${DOW.map(k=>runBtn('day|'+k, esc(DOW_NL[k]), 'sm'+(rp.settings.trainingDays.includes(k)?' active':''))).join('')}</div>
    <div class="form-grid cols-4">${runInp('Weken vooruit plannen','__run.set.planWeeksAhead',rp.settings.planWeeksAhead,{type:'number',inputmode:'numeric',min:1,max:8})}</div>
    ${runHrSettingsHTML()}
  </div></details>`;
  return h;
}

/* Instellingen › Mijn hartslag: leeftijd, de maximale hartslag (geschat of eigen) en de bevestiging na een wijziging */
function runHrSettingsHTML(){
  const h = runHrSet(), mx = runHrMax(), old = runHrOutdated();
  const ageOld = profileAge()==null && mx && mx.basis==='leeftijd' && h.ageSetAt && (Date.now()-Date.parse(h.ageSetAt)) > 365*86400000;
  return `<div class="small run-hrset"><b>Mijn hartslag</b></div>
    <div class="form-grid cols-4">${profileAge()!=null ? `<div class="field"><label>Leeftijd</label><div class="small" style="padding:8px 0">${profileAge()} jaar <span class="muted">(uit Mijn profiel)</span></div></div>` : runInp('Leeftijd', '__run.set.hrAge', h.age, { type:'number', inputmode:'numeric', min:RUN_HR_AGE[0], max:RUN_HR_AGE[1] })}
      ${h.useOwn ? runInp('Eigen maximale hartslag (bpm)', '__run.set.hrOwnMax', h.ownMax, { type:'number', inputmode:'numeric', min:RUN_HR_OWN[0], max:RUN_HR_OWN[1] }) : ''}</div>
    <div class="small">${mx ? `Maximale hartslag: <b>${mx.bpm} bpm</b> <span class="muted">(${mx.basis==='eigen' ? 'eigen waarde' : 'geschat uit je leeftijd'})</span>` : '<span class="muted">Vul je leeftijd in om met een hartslagdoel te trainen.</span>'}</div>
    ${ageOld ? `<div class="small">Klopt je leeftijd (${esc(h.age)}) nog? ${runBtn('hrAgeOk','Ja, klopt','sm')}</div>` : ''}
    <label class="run-hr-own small"><input type="checkbox" data-run-act="hrOwn" ${h.useOwn?'checked':''}> Eigen maximale hartslag gebruiken</label>
    ${old.length && h.dismissed!==runHrSig() ? runHrUpdateHTML(old.length) : ''}`;
}
const runHrSig = () => { const m = runHrMax(); return m ? m.bpm+'/'+m.basis : ''; };
const runHrUpdateHTML = n => `<div class="run-msg run-hr-upd">Je hartslaginstellingen zijn gewijzigd. ${n===1 ? '1 toekomstige training' : n+' toekomstige trainingen'} bijwerken?
  <div class="run-actions">${runBtn('hrUpdate','Bijwerken','sm primary')}${runBtn('hrLater','Niet nu','sm')}</div></div>`;
function runSet(parts, raw){
  RUI.msg = ''; const rp = RP(), k = parts[0];
  const bad = t => runMsg(t,'err');
  const numIn = (v,lo,hi) => { const n = num(String(v).replace(',','.')); return (n!=null && n>=lo && n<=hi) ? n : undefined; };
  if(k==='tpl'){
    const t = runTpl(parts[1]); if(!t) return; const f = parts[2];
    if(['name','notes'].includes(f)){ if(f==='name' && !String(raw).trim()) return bad('Een niveau heeft een naam nodig.'); t[f] = String(raw).trim(); }
    else if(['warmupMin','cooldownMin','runMin','walkMin'].includes(f)){ const sec = runParseMin(raw); if(sec==null || (f==='runMin' && sec<=0)) return bad('Vul een geldige duur in, bijvoorbeeld 3, 3,5 of 3:30.'); t[f] = sec/60; }
    else if(f==='reps'){ const n = parseInt(raw,10); if(!(n>=1 && n<=50)) return bad('Het aantal intervallen moet tussen 1 en 50 liggen.'); t.reps = n; }
    return;
  }
  if(k==='ses'){
    const s = runSes(parts[1]); if(!s) return; const f = parts[2];
    if(f==='date'){ if(!runValidDate(raw)) return bad('Ongeldige datum.'); if(raw!==s.date && !s.movedFrom) s.movedFrom = s.date; if(raw===s.movedFrom) delete s.movedFrom; s.date = raw; rp.sessions.sort(runByDate); RUI.openId = s.id; RUI.scrollTo = s.id; }
    else if(f==='notes') s.notes = String(raw);
    else if(f==='zone'){
      if(s.status!=='planned') return;
      const z = runHrZone(raw) ? String(raw) : '';
      if(!z){ s.target = { type:'none', low:null, high:null }; RUI.hrAsk = null; }
      else if(!runHrOn()){ RUI.hrAsk = s.id; RUI.hrAskZone = z; RUI.openId = s.id; return; }     // eerst één keer de leeftijd
      else { s.target = runHrTarget(z); runHrRemember(z); }
      RUI.openId = s.id; clearTimeout(window._rr); window._rr = setTimeout(renderCurrent, 60); }      // bereik meteen tonen
    else if(f==='manDuration' || f==='manDistance'){ s.manual = s.manual || {}; const v = String(raw).trim()===''?null:numIn(raw,0,1000); if(v===undefined) return bad('Vul een geldig getal in.'); s.manual[f==='manDuration'?'durationMin':'distanceKm'] = v; }
    coachSoon(); return;
  }
  if(k==='q'){
    const s = runSes(parts[1]); if(!s || s.status==='done') return; const q = runQ(s); q[parts[2]] = String(raw);
    const w = runParseMin(q.warm), r = runParseMin(q.run), wa = runParseMin(q.walk), c = runParseMin(q.cool), n = parseInt(q.reps,10);
    if(r==null || r<=0 || !(n>=1 && n<=50) || w==null || wa==null || c==null) return bad('Controleer de velden: duur als 3 of 3:30, intervallen tussen 1 en 50.');
    s.steps = runStepsFromParams({ warmupMin:w/60, reps:n, runMin:r/60, walkMin:wa/60, cooldownMin:c/60 }); coachSoon(); return;
  }
  if(k==='post'){
    const s = runSes(parts[1]); if(!s) return; const o = s.post = s.post || {}; const f = parts[2];
    if(f==='rpe' || f==='painDuring'){ const lo = f==='painDuring'?0:1; if(raw===''){ delete o[f]; } else { const n = numIn(raw,lo,10); if(n===undefined) return bad('Waarde tussen '+lo+' en 10.'); o[f] = n; } }
    else if(f==='painIncreased' || f==='gaitChanged'){ const b = runBool(raw); if(b===null) delete o[f]; else o[f] = b; }
    else if(f==='note') o.note = String(raw);
    else if(f==='vo2max'){ if(String(raw).trim()===''){ delete o.vo2max; } else { const n = numIn(raw,20,95); if(n===undefined) return bad('VO₂-max: een getal tussen 20 en 95.'); o.vo2max = Math.round(n*10)/10; } }
    return;
  }
  if(k==='set' && ['hrAge','hrOwnMax'].includes(parts[1])){
    const h = rp.settings.hr = rp.settings.hr || {}, wasOn = runHrOn(), f = parts[1];
    if(f==='hrAge'){ if(String(raw).trim()===''){ delete h.age; } else { const n = numIn(raw,0,150); if(n===undefined || n<RUN_HR_AGE[0] || n>RUN_HR_AGE[1]) return bad(n!==undefined && n<RUN_HR_AGE[0] ? 'De hartslagberekening is bedoeld voor volwassenen (18 jaar en ouder).' : 'Vul een leeftijd in tussen '+RUN_HR_AGE[0]+' en '+RUN_HR_AGE[1]+'.'); h.age = Math.round(n); h.ageSetAt = runNow(); } }
    else if(f==='hrOwnMax'){ if(String(raw).trim()===''){ delete h.ownMax; } else { const n = numIn(raw,RUN_HR_OWN[0],RUN_HR_OWN[1]); if(n===undefined) return bad('Eigen maximale hartslag: tussen '+RUN_HR_OWN[0]+' en '+RUN_HR_OWN[1]+' bpm.'); h.ownMax = Math.round(n); } }
    if(!wasOn && runHrOn()){                                         // net aangezet: gekozen training afmaken + eenmalige tip
      const s = RUI.hrAsk && runSes(RUI.hrAsk); if(s && s.status==='planned'){ s.target = runHrTarget(RUI.hrAskZone || 'rustig'); runHrRemember(RUI.hrAskZone || 'rustig'); RUI.openId = s.id; coachSoon(); }
      RUI.hrAsk = null;
      if(!h.tipSeen){ h.tipSeen = true; runMsg('Loop ontspannen. De hartslag is een richtwaarde; de tijd bepaalt wanneer de volgende stap begint.'); }
    }
    return;
  }
  if(k==='set' && parts[1]==='planWeeksAhead'){ const n = numIn(raw,1,8); if(n===undefined) return bad('Weken: 1 t/m 8.'); rp.settings.planWeeksAhead = Math.round(n); }
}

/* ---------- knoppen en acties ---------- */
/* laatst bewust gekozen intensiteit onthouden (per gebruiker, in zijn eigen stand); Zeer intensief wordt nooit de standaard */
function runHrRemember(z){ if(z==='zeerintensief') return; const h = RP().settings.hr = RP().settings.hr || {}; h.lastZone = z; }
function runAct0(act, args, el){
  const rp = RP(), today = todayISO(); RUI.msg = '';
  const s = args[0] ? runSes(args[0]) : null;
  if(act.startsWith('coach')) return coachAct(act, args);
  switch(act){
    case 'pastToggle': RUI.showPast = !RUI.showPast; break;
    case 'tab': RUI.tab = args[0]==='program' ? 'program' : 'overview'; break;
    case 'hrCalm': if(s && s.status==='planned' && runHrOn()){ s.target = runHrTarget('rustig'); RUI.openId = s.id; coachSoon(); runMsg('Deze training is nu Rustig ('+runBpm(s.target)+').'); } break;
    case 'hrOwn': { const h = rp.settings.hr = rp.settings.hr || {}; h.useOwn = !h.useOwn; } break;
    case 'hrAgeOk': { const h = rp.settings.hr = rp.settings.hr || {}; h.ageSetAt = runNow(); } break;
    case 'hrLater': { const h = rp.settings.hr = rp.settings.hr || {}; h.dismissed = runHrSig(); } break;
    case 'hrUpdate': { const list = runHrOutdated(); list.forEach(x=>{ x.target = runHrTarget(x.target.zone); }); if(list.length){ coachSoon(); runMsg(list.length===1 ? '1 training bijgewerkt.' : list.length+' trainingen bijgewerkt.'); } } break;
    case 'open': if(s){ RUI.tab = 'program'; RUI.openId = s.id; RUI.scrollTo = s.id; } break;
    case 'plan': { const t = runTpl(args[1]) || runCurrentTpl(); if(rp.restDays[args[0]]) delete rp.restDays[args[0]]; const n = runPlanOn(args[0], t); if(n && n.id){ RUI.openId = n.id; runMsg(n.name+' ingepland op '+runDateShort(args[0])+'.'); } break; }
    case 'planAhead': { const t = runCurrentTpl(), ds = runSuggestionDates(today, (rp.settings.planWeeksAhead||2)+1).filter(d=>d>=today);
      if(!ds.length) return runMsg('Er zijn geen vrije trainingsdagen om in te vullen.');
      if(!confirm(ds.length+' training(en) van '+t.name+' inplannen op: '+ds.map(runDateShort).join(', ')+'?')) return;
      ds.forEach(d=>runPlanOn(d,t)); runMsg(ds.length+' trainingen ingepland.'); break; }
    case 'addDoneFrom': { const a = runActivity(args[0]); if(!a) return; const n = runPlanOn(a.date, runCurrentTpl()); n.status = 'done'; n.doneAt = runNow(); n.addedAfterwards = true; runLinkActivity(n.id, a.externalId); runMsg('Toegevoegd als gedane training. Vul de vragen na de training in als je wilt.'); break; }
    case 'link': { const r = runLinkActivity(args[0], args[1]); if(!r.ok) return runMsg(r.msg,'err'); RUI.openId = args[0]; runMsg('Run gekoppeld.'); break; }
    case 'doneManual': if(s){ s.status = 'done'; s.doneAt = runNow(); s.manual = s.manual || {}; RUI.openId = s.id; runMsg('Gedaan, zonder Garmin-run.'); } break;
    case 'skip': if(s){ s.status = 'skipped'; runMsg('Overgeslagen. Dit telt niet als uitgevoerd en niet als achteruitgang.'); coachAutoRemove(s); } break;
    case 'undo': if(s){ if(s.status==='done'){ s.garminExternalId = null; s.manual = null; delete s.doneAt; } s.status = 'planned'; RUI.openId = s.id; runMsg('Ongedaan gemaakt: de training staat weer op gepland.'); } break;
    case 'del': if(s){ if(s.status==='done') return runMsg('Een uitgevoerde training verwijder je niet. Gebruik Ongedaan maken.','err'); if(!confirm('Deze training verwijderen?')) return; coachAutoRemove(s); rp.sessions = rp.sessions.filter(x=>x.id!==s.id); if(RUI.openId===s.id) RUI.openId = null; } break;
    case 'editToggle': if(s){ RUI.editId = RUI.editId===s.id ? null : s.id; RUI.openId = s.id; delete (RUI.q||{})[s.id]; } break;
    case 'close': RUI.openId = null; RUI.editId = null; break;          // training dichtklappen (ook na aanpassen)
    case 'pause': rp.settings.paused = true; rp.settings.pausedFrom = today; runMsg('Programma gepauzeerd. Er worden geen trainingen voorgesteld.'); break;
    case 'resume': rp.settings.paused = false; rp.settings.pausedFrom = null; runMsg('Programma hervat.'); break;
    case 'day': { const k = args[0], a = rp.settings.trainingDays; rp.settings.trainingDays = a.includes(k) ? a.filter(x=>x!==k) : DOW.filter(x=>a.includes(x)||x===k); break; }
    /* niveau kiezen (alleen via de evaluatie); komende trainingen op een ander niveau gaan mee als jij dat wilt */
    case 'level': { const t = runTpl(args[0]); if(!t) return; const changed = t.id!==rp.settings.currentTemplateId;
      if(changed || args[1]==='handhaven') runSetLevel(t.id, args[1]);
      const up = rp.sessions.filter(x=>x.status==='planned' && x.date>=today && x.templateId!==t.id);
      if(changed && up.length && confirm('Je komende '+up.length+' geplande training'+(up.length===1?'':'en')+' ook naar '+t.name+' zetten?')){ up.forEach(x=>{ runChangeSessionLevel(x.id, t.id); delete (RUI.q||{})[x.id]; }); runMsg('Huidig niveau: '+t.name+'. Je komende trainingen zijn ook '+t.name+'.'); }
      else runMsg('Huidig niveau: '+t.name+'.'); break; }
    case 'sesLevel': runChangeSessionLevel(args[0], args[1]); delete (RUI.q||{})[args[0]]; RUI.openId = args[0]; break;
    case 'tplDel': { const t = runTpl(args[0]); if(!t || rp.templates.length<=1) return;
      if(runDefaultTemplates().some(d=>d.id===t.id)) return runMsg('De standaardniveaus A t/m H kun je niet verwijderen. Pas ze aan als je iets wilt veranderen.', 'err');
      const used = rp.sessions.filter(x=>x.templateId===t.id).length;
      if(used) return runMsg('"'+t.name+'" hoort bij '+used+' training(en) en kan daarom niet worden verwijderd.', 'err');
      if(!confirm('Niveau "'+t.name+'" verwijderen?')) return;
      if(!confirm('Weet je het zeker? "'+t.name+'" wordt definitief verwijderd.')) return;
      rp.templates = rp.templates.filter(x=>x.id!==t.id); if(rp.settings.currentTemplateId===t.id) rp.settings.currentTemplateId = rp.templates[0].id; RUI.manage = null; break; }
    case 'tplEdit': RUI.manage = RUI.manage===args[0] ? null : args[0]; break;
    case 'tplAdd': { const base = runCurrentTpl(); const c = JSON.parse(JSON.stringify(base)); c.id = 'T'+runId().slice(1); c.name = 'Eigen niveau'; c.label = ''; rp.templates.push(c); RUI.manage = c.id; runMsg('Nieuw niveau toegevoegd (kopie van '+base.name+'). Pas het hieronder aan.'); break; }
    case 'exportAllLevels': { const r = fitExportAllLevels(); if(!r.ok) return runMsg('Export geblokkeerd: '+r.errors.join('; '),'err');
      dl(new Blob([r.zip],{type:'application/zip'}), 'Hardlopen_niveaus_FIT.zip'); runMsg('Zip met '+r.files.length+' workouts gedownload ('+r.files.map(f=>f.title).join(', ')+'). Pak hem uit en kopieer de .fit-bestanden naar het horloge (zie de uitleg hieronder).'); break; }
  }
}
