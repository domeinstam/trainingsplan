/* herstel-tijdlijn: historische logs + nieuwe dailyLogs + garmin-samenvatting  */
function recoveryTimeline(){
  const map = {};
  const put = (d,k,v)=>{ if(v==null||v==='') return; (map[d] = map[d]||{date:d}); if(map[d][k]==null) map[d][k]=v; };
  for(const [d,l] of Object.entries(HISTORICAL.logs||{})){
    put(d,'energy', num(l.morningEnergy)); put(d,'stiffness', num(l.morningStiffness)); put(d,'pain', num(l.morningPain));
    put(d,'restingHr', num(l.rhr)); put(d,'hrv', num(l.hrv));
    put(d,'sleepHours', l.sleepTime ? round(timeToMin(l.sleepTime)/60,2) : num(l.sleepHours));
    put(d,'pushups', num(l.pushups)); put(d,'weight', num(l.weightKg)); put(d,'era','historisch');
  }
  for(const [d,l] of Object.entries(CB.dailyLogs)){
    const g = state.garmin.daily[d] || {};
    put(d,'energy', num(l.energy)); put(d,'stiffness', num(l.stiffness)); put(d,'pain', num(l.pain));
    put(d,'feel', feelOf(l));                                    // gevoel 1–5 (meting en statistiek; telt niet mee in het hersteladvies)
    put(d,'restingHr', num(l.restingHr) ?? num(g.restingHr));
    put(d,'hrv', num(l.hrv) ?? num(g.nightHrv));
    put(d,'sleepHours', num(l.sleepHours) ?? num(g.sleepDuration));
    put(d,'weight', num(l.weightKg));
    put(d,'pushups', num(l.routineDetail?.pushupReps));
    for(const f of ['forwardBendReps','legRaiseReps','toeTouchReps','ohpL','ohpR','balanceReachL','balanceReachR']) put(d, f, num(l.routineDetail?.[f]));
    put(d,'era','blok2');
  }
  // energie uit de voor-controle bij Hardlopen telt mee als er die dag geen Dagcheck-energie is
  for(const [d,ck] of Object.entries((state.runningProgram && state.runningProgram.checks) || {})) put(d,'energy', num(ck && ck.energy));
  for(const [d,g] of Object.entries(state.garmin.daily)){
    // 'put' is first-wins: handmatige dailyLogs-waarden (hierboven) blijven voorrang houden
    put(d,'hrv', num(g.nightHrv)); put(d,'restingHr', num(g.restingHr)); put(d,'sleepHours', num(g.sleepDuration));
    put(d,'weight', num(g.weightKg));
  }
  return Object.values(map).sort((a,b)=> a.date.localeCompare(b.date));
}
/* 7-daagse hersteltrend = KALENDERVENSTER: vandaag en de 6 voorafgaande dagen.
   Geeft {value, n, of} zodat de UI "3 van 7 dagen" / "onvoldoende data" kan tonen. */
function recent7(key, refDate){
  const end = refDate || todayISO();
  const start = addDays(end, -6);
  const rows = recoveryTimeline().filter(r=> r.date>=start && r.date<=end && r[key]!=null);
  return { value: rows.length ? avg(rows.map(r=>r[key])) : null, n: rows.length, of:7, start, end };
}
function r7(key, refDate){ return recent7(key, refDate).value; }   // korte vorm waar alleen de waarde telt
/* Week 0-herstelwaarde: bevroren snapshot als vastgelegd, anders de live 7-daagse trend */
function w0Recovery(key){
  const M = CB.measurements;
  if(M.baselineFrozen && M.baselineRecovery && M.baselineRecovery[key]!=null)
    return { v:M.baselineRecovery[key], frozen:true };
  const r = recent7(key);
  return { v:r.value, frozen:false, n:r.n };
}
function freezeBaseline(){
  const M = CB.measurements;
  M.baselineRecovery = {};
  // Week 0 hoort bij de overgangsweek: vast venster 31 aug - 6 sep, niet "vandaag"
  const refDate = TRANSITION_END;
  for(const k of ['hrv','restingHr','sleepHours','energy','stiffness','pain']){
    const r = recent7(k, refDate); if(r.value!=null) M.baselineRecovery[k] = round(r.value, k==='sleepHours'?2:1);
  }
  M.baselineFrozen = true;
  M.baselineFrozenAt = todayISO();
  if(!M.baseline.date) M.baseline.date = refDate;
  saveState(); renderMeasure();
}
/* alle VO₂-max-waarden, één per datum: de Garmin-dagwaarde gaat voor, anders de waarde bij een run.
   (Voorheen won altijd de laatste run met een waarde, ook als Garmin al een nieuwere dagwaarde had.) */
function vo2Points(){
  const m = {};
  allRunRecords().filter(r=>r.done===true).forEach(r=>{ const v = num(r.vo2max); if(v!=null && r.date) m[r.date] = { x:r.date, y:v, src:'run' }; });
  Object.keys(state.garmin.daily).forEach(k=>{ const v = num(state.garmin.daily[k].vo2max); if(v!=null) m[k] = { x:k, y:v, src:'garmin' }; });
  // zelf overgenomen van het horloge bij een afgeronde training: gaat voor op een dagwaarde van dezelfde dag
  ((state.runningProgram && state.runningProgram.sessions) || []).forEach(s=>{ const v = typeof runOwnVo2==='function' ? runOwnVo2(s) : null; if(v!=null && s.date) m[s.date] = { x:s.date, y:v, src:'eigen' }; });
  return Object.values(m).sort((a,b)=>a.x.localeCompare(b.x));
}
function latestVo2Point(){ const p = vo2Points(); return p.length ? p[p.length-1] : null; }
function latestVo2(){ const p = latestVo2Point(); return p ? p.y : null; }
/* VO₂-max komt alleen binnen via een Garmin-export; na een week zonder nieuwe import een korte uitleg */
function vo2StaleNote(){
  const lp = latestVo2Point(), imp = state.garmin.meta && state.garmin.meta.lastImportedAt;
  if(!lp) return '';
  const days = Math.round((parseDate(todayISO()) - parseDate(lp.x))/86400000);
  if(days <= 7) return '';
  return `Laatste VO₂-max-waarde is van ${fmt(lp.x,{day:'numeric',month:'long'})}${imp?` (laatste Garmin-import ${new Date(imp).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})})`:''}. Geeft je horloge een nieuwe waarde, vul die dan in bij de training (Hardlopen › de training › Na de training › VO₂-max), of lees een Garmin-export in.`;
}

/* per-oefening krachtgeschiedenis — ALLEEN echte trainingssessies (geen leermomenten) */
/* eerdere registraties uit het ochtendroutine-detail (dailyLogs.routineDetail) als regels in de Krachtlog; alleen lezen, niets wordt gewijzigd */
const LEGACY_RT_MAP = {
  'r-pushups':    rd=> rd.pushupReps!=null && rd.pushupReps!=='' ? { setReps:String(rd.pushupReps), sets:1, tech:rd.pushupTech||'', rpeLast:rd.pushupRpe } : null,
  'r-forwardbend':rd=> rd.forwardBendReps!=null && rd.forwardBendReps!=='' ? { setReps:String(rd.forwardBendReps), sets:1 } : null,
  'r-slbalance':  rd=> (rd.balanceReachL!=null && rd.balanceReachL!=='') || (rd.balanceReachR!=null && rd.balanceReachR!=='') ? { setRepsL:String(rd.balanceReachL??''), setRepsR:String(rd.balanceReachR??'') } : null,
  'r-legraise':   rd=> rd.legRaiseReps!=null && rd.legRaiseReps!=='' ? { setReps:String(rd.legRaiseReps), sets:1 } : null,
  'r-toetouch':   rd=> rd.toeTouchReps!=null && rd.toeTouchReps!=='' ? { setReps:String(rd.toeTouchReps), sets:1 } : null,
  'r-ohp':        rd=> (rd.ohpL!=null && rd.ohpL!=='') || (rd.ohpR!=null && rd.ohpR!=='') ? { weightL:9, setRepsL:String(rd.ohpL??''), weightR:9, setRepsR:String(rd.ohpR??'') } : null,
};
function legacyRoutineHistory(exId){
  const f = LEGACY_RT_MAP[exId]; if(!f) return [];
  return Object.entries(CB.dailyLogs||{}).map(([date, l])=>{ const e = l && l.routineDetail ? f(l.routineDetail) : null; return e ? { date, session:'O', note: l.routineDetail.note || '', e } : null; }).filter(Boolean);
}
function strengthHistory(exId){
  return CB.strengthSessions.filter(s=> s.entries && s.entries[exId])
    .map(s=>({ date:s.date, session:s.session, routineName:s.routineName, note:s.note, e:s.entries[exId] }))
    .concat(legacyRoutineHistory(exId))
    .sort((a,b)=> a.date.localeCompare(b.date));
}
/* leermoment-geschiedenis per oefening (aparte collectie) */
function learningHistory(exId){
  return (CB.learningSessions||[]).filter(x=> x.exerciseId===exId)
    .slice().sort((a,b)=> a.date.localeCompare(b.date));
}
function latestTechniqueStatus(exId){
  const h = learningHistory(exId);
  return h.length ? h[h.length-1].techniqueStatus : null;
}
function parseSetReps(v){ if(v==null) return []; return String(v).split(/[,\s/xX]+/).map(x=>num(x)).filter(x=>x!=null); }
function loadKey(e, side){
  const w = side==='L'?e.weightL : side==='R'?e.weightR : e.weight;
  const reps = parseSetReps(side==='L'?e.setRepsL : side==='R'?e.setRepsR : e.setReps);
  const top = reps.length?Math.min(...reps):null; // laagste set = zwakste; progressie vraagt álle sets aan bovengrens
  return { w:num(w), reps, minReps:top };
}
/* double-progression advies (adviseert, verplicht niets).
   Criterium: 2 vergelijkbare sessies · zelfde gewicht · alle sets aan de bovengrens ·
   techniek goed · reserve over (RIR ≥ 2, of bij ontbreken RPE ≤ 8). */
function progressionAdvice(ex){
  if(ex.kind!=='strength' || !ex.range) return [];
  if(exStage(ex.id) !== 'trainen') return [];   // geen gewichtsprogressie-advies in LEREN of VERTROUWD
  const [lo,hi] = ex.range;
  // overgangsweek-sessies tellen niet mee voor double progression (nog geen officieel programma)
  const hist = strengthHistory(ex.id).filter(h=> !isTransitionDate(h.date));
  const sides = ex.lr ? ['L','R'] : [null];
  const out = [];
  for(const side of sides){
    const rows = hist.map(h=>({ date:h.date, ...loadKey(h.e, side), rir:num(h.e.rir), rpe:num(h.e.rpeLast), tech:h.e.tech }))
                     .filter(r=> r.w!=null && r.reps.length);
    if(rows.length < 2) continue;
    const last2 = rows.slice(-2);
    const sameW  = last2[0].w === last2[1].w;
    const atTop  = last2.every(r=> r.minReps!=null && r.minReps >= hi);
    const techOk = last2.every(r=> r.tech!=='minder');
    const reserveOk = last2.every(r=>{
      if(r.rir!=null) return r.rir >= 2;
      if(r.rpe!=null) return r.rpe <= 8;
      return false;   // geen reserve-informatie → geen advies
    });
    if(sameW && atTop && techOk && reserveOk){
      out.push({ side, msg:`${side?('Zijde '+side+' — '):''}progressiecriterium bereikt: 2 sessies alle sets ${hi}, techniek goed, ~2+ herhalingen in reserve. Hogere weerstand overwegen; daarna terug naar ${lo}–${lo+2}. Jij beslist.` });
    }
  }
  if(ex.lr && out.length===1) out.push({ note:'De zwakkere zijde bepaalt wanneer je het gewicht verhoogt.' });
  return out;
}

/* ===========================================================================
   DEZE-WEEK TRACKER  (fasebewust — leermoment ≠ gemiste krachttraining)
   =========================================================================== */
/* een actieve routine met oefeningen uit Kracht A of B vervangt het weekdoel Kracht A/B (vanaf de week waarin hij begint);
   eerdere krachtsessies blijven bewaard en tellen in hun eigen weken gewoon mee */
function strengthRoutine(wi){
  const end = weekDates(wi)[6];
  return routinesActive().find(r=> rtExercises(r).some(x=>{ const e = rtEx(x.exId); return e && (e.session==='A' || e.session==='B'); })
    && String(routineAlt(r) || r.createdAt || '').slice(0,10) <= end) || null;
}
/* getoond weeknummer = week van het jaar (ISO, zoals in de kalender bij Hardlopen); intern blijft wi de week van het blok */
function weekNo(wi){ return runIsoWeek(weekDates(wi)[0]); }
function weekStatus(wi){
  const ds = weekDates(wi);
  const cfg = weekConfig(wi), sr = strengthRoutine(wi);
  // alleen expliciet uitgevoerd (done===true) telt; null (onbekend) en false tellen niet mee
  const runsDone = allRunRecords().filter(r=> r.done===true && inWeek(r.date,wi));
  const runsLogged = allRunRecords().filter(r=> inWeek(r.date,wi));
  const wp = weekPlan(wi);
  const prog = runReplacesCoach() ? runWeekInfo(ds) : null;     // eigen hardloopprogramma vervangt de oude Coach-planning
  const coachDays = prog ? prog.days : (Array.isArray(wp.coachDays) ? wp.coachDays : []);
  const coachTarget = prog ? prog.target : (num(wp.coachTarget) ?? (coachDays.length || null));
  const aDone = CB.strengthSessions.some(s=> s.session==='A' && inWeek(s.date,wi));
  const bDone = CB.strengthSessions.some(s=> s.session==='B' && inWeek(s.date,wi));
  const walkWeek = isLongWalkWeek(wi);
  const walkDone = CB.walks.some(w=> inWeek(w.date,wi));
  let routineDays = 0;
  for(const d of ds){ if(routineDoneish(CB.dailyLogs[d])) routineDays++; }
  // leermomenten deze week (voor de focus-oefening + eventuele herhaling van eerder geleerde)
  const learnWeek = (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi));
  const focusLearn = cfg.focusExercise ? learnWeek.filter(x=> x.exerciseId===cfg.focusExercise) : [];
  return {
    wi, dates:ds, walkWeek, cfg,
    coach:{ done:runsDone.length, logged:runsLogged.length, unknown:runsLogged.filter(r=>r.done==null).length, target:coachTarget, days:coachDays, label: coachTarget!=null ? `${runsDone.length} / ${coachTarget}` : `${runsDone.length} uitgevoerd${runsLogged.length>runsDone.length?` · ${runsLogged.length-runsDone.length} onbekend/niet`:''}` },
    strengthA:{ applicable:cfg.strengthA && !sr, done:aDone },
    strengthB:{ applicable:cfg.strengthB && !sr, done:bDone },
    strengthRoutine: sr,
    longWalk:{ done:walkDone, applicable:walkWeek },
    routine:{ done:routineDays, of:7 },
    routines: routineWeek(wi),        // per eigen routine: gedaan / eigen weekdoel
    learning:{
      target: cfg.learningTarget, done: focusLearn.length, total: learnWeek.length,
      focusExercise: cfg.focusExercise,
      focusTech: focusLearn.length ? focusLearn[focusLearn.length-1].techniqueStatus : (cfg.focusExercise ? latestTechniqueStatus(cfg.focusExercise) : null),
      met: !cfg.focusExercise || cfg.learningTarget===0 || focusLearn.length >= cfg.learningTarget,
    },
    openItems: [
      cfg.learningTarget>0 && cfg.focusExercise && focusLearn.length < cfg.learningTarget && `Leermoment ${exName(cfg.focusExercise)}`,
      cfg.strengthA && !sr && !aDone && 'Kracht A',
      cfg.strengthB && !sr && !bDone && 'Kracht B',
      walkWeek && !walkDone && 'Lange wandeling',
    ].filter(Boolean),
  };
}

/* uitvoering blok (%) — fasebewust: alleen wat het curriculum die week vraagt.
   Leermomenten: soft geteld, geen "achterstand". */

/* uitgevoerde trainingsminuten per week uit ECHT geregistreerde duur; geen verzonnen planning.
   'plan' bevat alleen wat we werkelijk weten (ochtendroutine-richttijd); rest = null → UI toont "—". */
function weekMinutes(wi){
  const ds = weekDates(wi);
  const target = num(CB.routineMinutesTarget) || 45;
  const done = { hardlopen:0, leermomenten:0, kracht:0, ochtendroutine:0, 'lange wandeling':0, avondwandeling:0 };
  let routineDays = 0;
  for(const d of ds){
    const l = CB.dailyLogs[d] || {};
    const rMin = num(l.routineMin);
    // routine 'gedaan' telt als 1 routinedag voor adherence, maar NIET automatisch als
    // exacte trainingsminuten — alleen een echt ingevulde routineMin telt in de minuten.
    if(rMin!=null) done.ochtendroutine += rMin;
    if(rMin!=null || routineDoneish(l)) routineDays++;
    done.avondwandeling += num(l.eveningWalkMin) || 0;
    allRunRecords().filter(r=>r.date===d).forEach(r=> done.hardlopen += num(r.totalMin)||0);
    CB.strengthSessions.filter(s=>s.date===d).forEach(s=> done.kracht += num(s.durationMin)||0);
    (CB.learningSessions||[]).filter(x=>x.date===d).forEach(x=> done.leermomenten += num(x.durationMin)||0);
    CB.walks.filter(w=>w.date===d).forEach(w=> done['lange wandeling'] += num(w.totalMin)||0);
  }
  Object.keys(done).forEach(k=> done[k]=Math.round(done[k]));
  // ochtendroutine-richttijd is een schatting, geen meting → geen 'gepland'-minuten opdringen
  const plan = { hardlopen:null, leermomenten:null, kracht:null, ochtendroutine: null, 'lange wandeling':null, avondwandeling:null };
  const doneTotal = Object.values(done).reduce((a,b)=>a+b,0);
  return { plan, done, routineDays, routineTarget:target, doneTotal };
}

/* Garmin-minuten per week (uit state.garmin.activities), gesplitst in hardlopen / wandelen / overig */
function garminWeekMinutes(wi){
  const ds = new Set(weekDates(wi));
  const out = { run:0, walk:0, other:0 };
  for(const a of (state.garmin.activities||[])){
    if(!ds.has(a.date)) continue;
    const m = num(a.durationMin) || 0;
    if(GARMIN_RUN_TYPES.includes(a.type)) out.run += m; else if(GARMIN_WALK_TYPES.includes(a.type)) out.walk += m; else out.other += m;
  }
  Object.keys(out).forEach(k=> out[k]=Math.round(out[k]));
  return out;
}
/* belastingsconflicten — signaleren, niet blokkeren */
function weekConflicts(wi){
  const ds = weekDates(wi);
  const legDays = new Set();  // datums met (voorgenomen of uitgevoerde) zware beenprikkel
  const learnLegDays = new Set(); // technische leermomenten voor benen (lichte prikkel)
  const wp = weekPlan(wi);
  const LEG_EX = new Set(['goblet-squat','rdl','split-squat','calf-a','calf-b']);
  CB.strengthSessions.filter(s=> inWeek(s.date,wi) && (s.session==='A'||s.session==='B')).forEach(s=> legDays.add(s.date));
  if(wp.strengthADay && !CB.strengthSessions.some(s=>s.session==='A'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthADay)]; if(d) legDays.add(d); }
  if(wp.strengthBDay && !CB.strengthSessions.some(s=>s.session==='B'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthBDay)]; if(d) legDays.add(d); }
  (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi) && LEG_EX.has(x.exerciseId)).forEach(x=> learnLegDays.add(x.date));
  const runDays = new Set(allRunRecords().filter(r=> inWeek(r.date,wi)).map(r=>r.date));
  const walkDay = (isLongWalkWeek(wi) && wp.longWalkDay) ? ds[DOW.indexOf(wp.longWalkDay)] : null;
  const walkLogged = CB.walks.filter(w=> inWeek(w.date,wi)).map(w=>w.date);
  const walkDays = new Set([...(walkDay?[walkDay]:[]), ...walkLogged]);

  const out = [];
  const near = (a,b)=> Math.abs((parseDate(a)-parseDate(b))/86400000) <= 1;
  const leg = [...legDays].sort();
  for(const d of leg){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij een ${runReplacesCoach()?'hardlooptraining':'Garmin Coach-run'} (${fmt(r,{weekday:'short'})}).`); }
    for(const w of walkDays){ if(near(d,w) && d!==w) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij de lange wandeling (${fmt(w,{weekday:'short'})}).`); }
  }
  for(let i=1;i<leg.length;i++){ if(near(leg[i-1],leg[i])) out.push(`${fmt(leg[i-1],{weekday:'short'})}–${fmt(leg[i],{weekday:'short'})}: twee zware beenprikkels liggen dicht bij elkaar — las er een rustige dag tussen.`); }
  for(const d of learnLegDays){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: technisch leermoment voor de benen ligt vlak bij een ${runReplacesCoach()?'hardlooptraining':'Garmin Coach-run'} (${fmt(r,{weekday:'short'})}) — hou het leermoment dan echt licht.`); }
  }
  return [...new Set(out)];
}

/* velden die string moeten blijven; al het andere wordt Number zodra het een zuiver getal is */
const TEXT_KEYS = new Set(['type','planned','done','tech','note','notes','avgPace','movingPace','bestPace',
  'plannedContent','doneContent','traffic','routineDone','date','startDate','hoofddoel',
  'forwardBendFloor','pushupTech','balanceRvsL','strengthADay','strengthBDay','longWalkDay',
  'setReps','setRepsL','setRepsR',
  'exerciseId','techniqueStatus','loadFeeling','reps','tagline']);
function coerce(key, raw){
  if(raw==='' || raw==null) return null;
  if(key==='longWalkEveryOtherWeek') return raw===true || raw==='ja' || raw==='true';
  // Coach-run 'Uitgevoerd': 3 echte toestanden — true / false / null (leeg = null via bovenstaande)
  if(key==='done') return raw===true||raw==='ja' ? true : raw===false||raw==='nee' ? false : null;
  // Slaapduur: accepteer u:mm (uit de Dagdata-tabel) én decimaal; sla altijd decimaal op
  if(key==='sleepHours' && typeof raw==='string' && /^\s*\d{1,2}:\d{1,2}\s*$/.test(raw)){
    const [h,m] = raw.trim().split(':').map(Number); return round(h + m/60, 4);
  }
  if(TEXT_KEYS.has(key)) return raw;
  if(typeof raw==='number') return raw;
  if(typeof raw==='string' && /^-?\d+(?:[.,]\d+)?$/.test(raw.trim())) return Number(raw.trim().replace(',','.'));
  return raw;
}
function fInput(label,path,val,type='number',extra=''){ return `<div class="field"><label>${esc(label)}</label><input type="${type}" data-bind="${path}" value="${val==null?'':esc(val)}" ${extra}></div>`; }
function fSelect(label,path,val,opts){ return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t||'—')}</option>`; }).join('')}</select></div>`; }
function fText(label,path,val,wide=true){ return `<div class="field ${wide?'wide':''}"><label>${esc(label)}</label><textarea data-bind="${path}">${esc(val||'')}</textarea></div>`; }
function pctChange(base,latest){ if(base==null||latest==null||base===0) return null; return round((latest-base)/Math.abs(base)*100,1); }
function deltaCell(base,latest,dir,showPct){
  if(base==null||latest==null) return '<td class="num muted">—</td>';
  const d = latest-base;
  const good = (dir==='down'||dir==='downPace') ? d<0 : d>0;
  const p = showPct ? pctChange(base,latest) : null;
  return `<td class="num ${d===0?'':good?'delta-pos':'delta-neg'}">${(d>0?'+':'')+round(d,2)}${p!=null?` <span class="small">(${p>0?'+':''}${p}%)</span>`:''}</td>`;
}
function lineChart(rows, opts={}){
  const w=opts.w||520, h=opts.h||150, pl=40, pr=12, pt=12, pb=22;
  rows = (rows||[]).filter(r=>r&&r.y!=null);
  if(rows.length<2) return `<div class="small muted">Nog onvoldoende meetpunten (${rows.length}).</div>`;
  const s2 = (opts.series2||[]).filter(r=>r&&r.y!=null);   // optionele tweede reeks; bestaande calls geven dit niet mee
  const all = rows.concat(s2);
  const xs=all.map(r=>parseDate(r.x).getTime()), ys=all.map(r=>r.y);
  let ymin=Math.min(...ys), ymax=Math.max(...ys); if(ymin===ymax){ymin-=1;ymax+=1;}
  if(opts.yfix){ ymin = opts.yfix[0]; ymax = opts.yfix[1]; }                 // vaste schaal (bijv. gevoel 1–5)
  else { const p=(ymax-ymin)*0.12; ymin-=p; ymax+=p; }
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const X=t=>pl+(t-xmin)/((xmax-xmin)||1)*(w-pl-pr);
  const Y=v=>pt+(ymax-v)/((ymax-ymin)||1)*(h-pt-pb);
  const poly=(arr)=>arr.map(r=>`${round(X(parseDate(r.x).getTime()),1)},${round(Y(r.y),1)}`).join(' ');
  const yl=v=>opts.invertLabel?secToPace(v):round(v,(ymax-ymin)<5?1:0);
  const gy=[0,.5,1].map(f=>{const v=ymin+(ymax-ymin)*f,y=Y(v);return `<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${yl(v)}</text>`;}).join('');
  const line2 = s2.length>=2 ? `<polyline fill="none" stroke="${opts.color2||'#2A4560'}" stroke-width="2.8" points="${poly(s2)}"/>` : '';
  // per punt: onzichtbare ruime hover-zone + zichtbare stip; data-tip voedt de zwevende tooltip (#chartTip)
  const fv = v => opts.invertLabel ? secToPace(v) : round(v, 2);
  const dots = (arr, col, op, name) => arr.map(r=>{
    const cx = round(X(parseDate(r.x).getTime()),1), cy = round(Y(r.y),1);
    const t = `${fmt(r.x,{weekday:'short',day:'numeric',month:'long'})} — ${fv(r.y)}${opts.unit?' '+opts.unit:''}${name?` · ${name}`:''}`;
    return `<g class="pt" data-tip="${esc(t)}">`
      + `<circle cx="${cx}" cy="${cy}" r="8" fill="transparent" stroke="transparent"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${s2.length?2:2.6}" fill="${col}"${op?` opacity="${op}"`:''}/></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${gy}
    <line class="axis" x1="${pl}" y1="${pt}" x2="${pl}" y2="${h-pb}"/><line class="axis" x1="${pl}" y1="${h-pb}" x2="${w-pr}" y2="${h-pb}"/>
    <polyline fill="none" stroke="${opts.color||'#3D6A92'}" stroke-width="${s2.length?1.5:2.5}" ${s2.length?'opacity="0.55"':''} points="${poly(rows)}"/>
    ${line2}
    ${s2.length ? dots(s2, opts.color2||'#2A4560', 0, opts.name2||'7-daags gemiddelde') : ''}
    ${dots(rows, opts.color||'#3D6A92', s2.length?0.6:0, s2.length?(opts.name1||'dagwaarde'):null)}
    <text x="${pl}" y="${h-6}">${fmt(rows[0].x,{day:'numeric',month:'short'})}</text>
    <text x="${w-pr}" y="${h-6}" text-anchor="end">${fmt(rows[rows.length-1].x,{day:'numeric',month:'short'})}</text></svg>`;
}

/* ===========================================================================
   VIEW: VANDAAG  — antwoord binnen 5 seconden op: wat vandaag / wat deze week / wat registreren
   =========================================================================== */
/* Eén context per dag: wat is vandaag de relevante volgende actie — "less is more".
   Geen black-box: puur datum + fase + planning + bestaande data → één primaire suggestie. */
function getTodayContext(d){
  const inTransition = isTransitionDate(d);
  const wi = weekIndexFor(d);
  const logged = {
    coach: allRunRecords().some(r=>r.date===d),
    learning: (CB.learningSessions||[]).some(x=>x.date===d),
    strengthA: CB.strengthSessions.some(s=>s.date===d && s.session==='A'),
    strengthB: CB.strengthSessions.some(s=>s.date===d && s.session==='B'),
    longwalk: CB.walks.some(w=>w.date===d),
  };
  if(inTransition || wi<0){
    return {
      period: inTransition ? 'transition' : 'before',
      cfg:null, ws:null, focusEx:null,
      title: inTransition ? 'Overgangsweek' : 'Vóór de programmastart',
      subtitle: inTransition ? `programma start ${fmt(blockStart(),{day:'numeric',month:'long'})}` : '',
      primary: null,
      logged, plannedCoach:false,
    };
  }

  const dk = dowKey(d);
  const cfg = weekConfig(wi);
  const ws = weekStatus(wi);
  const wp = weekPlan(wi);
  const focusEx = cfg.focusExercise ? state.exercises.find(x=>x.id===cfg.focusExercise) : null;
  const registeredToday = logged.coach || logged.strengthA || logged.strengthB || logged.longwalk || logged.learning;

  // --- Prioriteit: 1) expliciet op deze dag gepland  2) geregistreerd op deze dag
  //     3) vaste dagspecifieke activiteit (voorstel-dag uit weekplan)  4) openstaand weekdoel = suggestie ---
  const plannedCoach     = runReplacesCoach() ? !!runPlannedOn(d) : coachPlanDays(wi).includes(dk);
  const walkPlannedToday = ws.walkWeek && wp.longWalkDay===dk && !ws.longWalk.done;
  const strengthADayToday = ws.strengthA.applicable && wp.strengthADay===dk && !ws.strengthA.done;
  const strengthBDayToday = ws.strengthB.applicable && wp.strengthBDay===dk && !ws.strengthB.done;

  let primary = null;
  if(registeredToday) primary = null;                    // de kaart(en) tonen het al
  else if(plannedCoach) primary = { type:'coach', minimal:true, label: runReplacesCoach() ? 'Hardlopen — '+((runPlannedOn(d)||{}).name||'training')+' gepland vandaag' : 'Garmin Coach-run — gepland vandaag' };
  else if(walkPlannedToday) primary = { type:'longwalk', label:'Lange wandeling' };
  else if(strengthADayToday) primary = { type:'strengthA', label:'Kracht A' };
  else if(strengthBDayToday) primary = { type:'strengthB', label:'Kracht B' };

  // openstaande weekdoelen — nooit primair, alleen klein/secundair op Vandaag
  const openGoals = [];
  if(focusEx && !ws.learning.met) openGoals.push({ type:'learning', label:`Leermoment ${focusEx.name} leren` });
  if(ws.strengthA.applicable && !ws.strengthA.done && !strengthADayToday) openGoals.push({ type:'strengthA', label:'Kracht A' });
  if(ws.strengthB.applicable && !ws.strengthB.done && !strengthBDayToday) openGoals.push({ type:'strengthB', label:'Kracht B' });
  if(ws.walkWeek && !ws.longWalk.done && !walkPlannedToday) openGoals.push({ type:'longwalk', label:'Lange wandeling' });

  return {
    period:'program', cfg, ws, focusEx, plannedCoach, openGoals,
    learnRelevant: !!(focusEx && !ws.learning.met), walkToday: walkPlannedToday,
    title:`Week ${weekNo(wi)} · ${PHASE_LABEL[cfg.phase]||cfg.phase}`,
    primary, logged,
  };
}
/* welke invoerkaarten toont Vandaag: alleen wat al geregistreerd is, of expliciet aangeklikt
   (via de primaire actie of "Iets anders gedaan?") — nooit automatisch een volledig formulier. */
function todayCards(d){
  const set = new Set();
  if(ui.addOn===d && ui.addType) set.add(ui.addType);
  if((CB.coachRuns||[]).some(r=>r.date===d)) set.add('coach');   // alleen echte (handmatige/oude) Coach-runs; trainingen uit het hardloopprogramma hebben hun eigen blok
  CB.strengthSessions.filter(s=>s.date===d && (s.session==='A' || s.session==='B')).forEach(s=> set.add(s.session==='A'?'strengthA':'strengthB'));
  if(CB.walks.some(w=>w.date===d)) set.add('longwalk');
  if((CB.learningSessions||[]).some(x=>x.date===d)) set.add('learning');
  return [...set];
}

/* "Iets anders gedaan? / training aanpassen" — beheerpaneel voor bestaande records.
   Toont bewust alleen: records op de bekeken dag, plus records die (verkeerd) op een
   datum ná vandaag staan (kan niet kloppen). Geen brede ±week-lijst meer — dat gaf
   ruis met trainingen die gewoon goed staan. Nieuwe activiteit toevoegen kan ook. */
function otherActivitiesPanel(d, opts){
  opts = opts || {};
  const isFuture = !!opts.isFuture;
  const cardsToday = opts.cardsToday || [];
  const primaryType = opts.primaryType || null;
  [['c',CB.coachRuns],['s',CB.strengthSessions],['w',CB.walks],['l',CB.learningSessions]].forEach(([pre,arr])=>{
    (arr||[]).forEach(r=>{ if(!r.id) r.id = pre + Date.now().toString(36) + Math.random().toString(36).slice(2,6); });
  });
  const dashJoin = a => a.filter(Boolean).join(' · ');
  const relevant = dt => dt===d || dt>todayISO();
  const nearby = [];
  CB.coachRuns.forEach(r=>{ if(relevant(r.date)){
    const ga = r.garminExternalId ? (state.garmin.activities||[]).find(a=>a.externalId===r.garminExternalId) : null;
    nearby.push({kind:'coach', id:r.id, date:r.date, label:'Garmin Coach-run', tint:'#bcd6e5',
      detail: dashJoin([r.distanceKm!=null?`${nl(r.distanceKm)} km`:null, r.totalMin!=null?`${nl(r.totalMin)} min`:null, r.avgPace||null, r.avgHr!=null?`HR ${nl(r.avgHr)}`:null, r.maxHr!=null?`max ${nl(r.maxHr)}`:null, r.vo2max!=null?`VO₂ ${nl(r.vo2max)}`:null]),
      srcNote: ga ? `Uit Garmin-import — activiteit van ${fmt(ga.date,{weekday:'short',day:'numeric',month:'long'})}${ga.startTime?', '+ga.startTime.slice(11,16):''}` : (r._source && String(r._source).startsWith('garmin') ? 'Uit Garmin-import' : null),
      garminDate: ga && ga.date!==r.date ? ga.date : null });
  }});
  (CB.learningSessions||[]).forEach(x=>{ if(relevant(x.date)) nearby.push({kind:'learning', id:x.id, date:x.date, label:'Leermoment', tint:'#BFDCC9',
    detail: dashJoin([exName(x.exerciseId), x.durationMin!=null?`${nl(x.durationMin)} min`:null]) }); });
  CB.strengthSessions.forEach(s=>{ if(relevant(s.date)) nearby.push({kind:'strength', id:s.id, date:s.date, label: s.session==='R' ? 'Routine · '+(s.routineName||'') : `Kracht ${s.session}`, tint:'#d5c8e6',
    detail: s.durationMin!=null?`${nl(s.durationMin)} min`:'' }); });
  CB.walks.forEach(w=>{ if(relevant(w.date)) nearby.push({kind:'walk', id:w.id, date:w.date, label:'Lange wandeling', tint:'#e6d9a8',
    detail: dashJoin([w.distanceKm!=null?`${nl(w.distanceKm)} km`:null, w.totalMin!=null?`${nl(w.totalMin)} min`:null]) }); });
  nearby.sort((a,b)=> a.date.localeCompare(b.date) || a.label.localeCompare(b.label));

  const otherTypes = [
    ['learning','+ Leermoment'], ['coach','+ Hardlopen (handmatig)'], ['longwalk','+ Lange wandeling'],
    ['strengthA','+ Kracht A'], ['strengthB','+ Kracht B'],
  ].filter(([t])=> !cardsToday.includes(t) && t!==primaryType);

  const hasFut = nearby.some(n=>n.date>todayISO());
  if(!nearby.length && !(otherTypes.length && !isFuture)) return '';
  let html = `<details class="acc"${hasFut?' open':''}><summary>Iets anders gedaan? / training aanpassen</summary><div class="acc-body">`;
  if(nearby.length){
    html += `<p class="tny muted" style="margin-top:0">${hasFut
      ? 'Een training kan niet op een datum in de toekomst staan — verzet naar de juiste dag of verwijder:'
      : 'Op deze dag geregistreerd — verzet naar de juiste dag of verwijder:'}</p>`;
    html += nearby.map(n=>{
      const moving = ui.moveOn && ui.moveOn.kind===n.kind && ui.moveOn.id===n.id;
      const fut = n.date>todayISO();
      return `<div style="border:1px solid var(--line2);border-left:3px solid ${n.tint};border-radius:10px;padding:10px 12px;margin:8px 0">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">
          <b>${esc(n.label)}</b>
          <span class="tny muted">${esc(fmt(n.date,{weekday:'long',day:'numeric',month:'long'}))}${n.date===d?' · deze dag':(fut?' · staat in de toekomst':'')}</span>
        </div>
        ${n.detail?`<div class="small muted" style="margin-top:2px">${esc(n.detail)}</div>`:''}
        ${n.srcNote?`<div class="tny muted" style="margin-top:2px">${esc(n.srcNote)}</div>`:''}
        <div class="chips" style="margin-top:8px">
          ${moving
            ? `<input type="date" id="moveDateInput" value="${n.date}" max="${todayISO()}"><button class="btn primary sm" data-move-save="${n.kind}|${n.id}">Opslaan</button><button class="btn sm" data-move-cancel>Annuleren</button>`
            : `${n.garminDate?`<button class="btn primary sm" data-move-save-to="${n.kind}|${n.id}|${n.garminDate}">Zet op ${esc(fmt(n.garminDate,{day:'numeric',month:'long'}))} (Garmin-datum)</button>`:''}<button class="btn sm" data-move-start="${n.kind}|${n.id}">${n.garminDate?'Andere datum':'Verzetten'}</button><button class="btn danger sm" data-move-delete="${n.kind}|${n.id}">Verwijderen</button>`}
        </div>
      </div>`;
    }).join('');
  }
  if(otherTypes.length && !isFuture){
    html += `<p class="tny muted"${nearby.length?'':' style="margin-top:0"'}>Nog niet geregistreerd — toevoegen:</p>
      <div class="addbar">${otherTypes.map(([t,label])=>`<button class="btn sm" data-add="${t}|${d}">${esc(label)}</button>`).join('')}</div>`;
  }
  html += `</div></details>`;
  return html;
}

/* ===========================================================================
   DAGADVIES v1 — transparant, regelgebaseerd, geen black box, blokkeert niets.
   VANDAAG-waarden (energie/stijfheid/pijn) zijn primair; slaap + 7-daagse
   HRV/RHR-trend zijn context. Schalen: energie hoger = gunstiger; stijfheid
   en pijn hoger = ongunstiger. Historische waarden worden nooit geïnverteerd.
   =========================================================================== */
const ADVICE_VERSION = 2;          // 2 = dezelfde herstelbeoordeling als Hardlopen (runReadiness); versie 1 blijft bij oude dagen bewaard
const ADVICE_LABEL = { green:'Normaal belastbaar', orange:'Verminderde belastbaarheid', red:'Herstel heeft prioriteit' };
const ADVICE_EMOJI = { green:'🟢', orange:'🟠', red:'🔴' };
function adviceInputs(d){
  const l = CB.dailyLogs[d] || {};
  const g = state.garmin.daily[d] || {};
  return {
    energy: num(l.energy), stiffness: num(l.stiffness), pain: num(l.pain),
    sleepHours: num(l.sleepHours) ?? num(g.sleepDuration),
    hrv7: r7('hrv', d), rhr7: r7('restingHr', d),
  };
}
function dayAdvice(d){
  const inp = adviceInputs(d), rd = runReadiness(d);
  const SEV = { red:'strong', orange:'moderate', light:'moderate', info:'info' };
  const reasons = rd.reasons.map(r=>({ sev:SEV[r.sev]||'info', text:r.text }));
  const status = rd.undetermined ? null : rd.auto;
  return { status, label: status ? ADVICE_LABEL[status] : 'Nog niet te bepalen', emoji: status ? ADVICE_EMOJI[status] : '⚪',
    reasons, inputs: inp, version: ADVICE_VERSION, readiness: rd,
    summary: status ? (reasons.filter(r=>r.sev!=='info').slice(0,3).map(r=>r.text).join(' · ') || todayValuesText(rd.values)) : 'vul de Dagcheck in' };
}
/* snapshot: bewaar het advies + de inputs waarop het is gebaseerd. Alleen
   (her)schrijven als de inputs veranderd zijn of er nog geen snapshot is —
   geen retroactieve herberekening van oude dagen zonder reden. */
function snapshotAdvice(d){
  if(d > todayISO()) return;
  const a = dayAdvice(d);
  if(!a.status && !(CB.dailyLogs[d] && CB.dailyLogs[d].advice)) return;
  const l = ensureLog(d);
  const key = JSON.stringify(a.inputs);
  if(l.advice && l.advice.inputsKey === key && l.advice.version === a.version) return;
  if(l.advice && d < todayISO() && l.advice.version !== a.version) return;     // oude dag: het advies van toen blijft bewaard
  l.advice = { status:a.status, reasons:a.reasons.map(r=>r.text), version:a.version, inputs:a.inputs, inputsKey:key, computedAt: new Date().toISOString() };
}
/* strengste van automatisch advies en eigen beoordeling (rood > oranje > groen): een eigen beoordeling
   kan het advies strenger maken, maar een automatische waarschuwing nooit wegnemen. Zonder automatisch
   advies telt de eigen beoordeling. Alleen voor weergave: opgeslagen gegevens worden niet aangepast. */
const STATUS_RANK = { green:0, orange:1, red:2 };
function strictestStatus(auto, own){
  if(!(own in STATUS_RANK)) return auto || null;
  if(!(auto in STATUS_RANK)) return own;
  return STATUS_RANK[own] > STATUS_RANK[auto] ? own : auto;
}
/* effectieve dagstatus voor historie/tellingen: de strengste van het bewaarde advies en je eigen beoordeling */
function effectiveDayStatus(d){
  const l = CB.dailyLogs[d]; if(!l) return null;
  return strictestStatus(l.advice && l.advice.status, l.traffic);
}
/* -- alleen nog voor de Progressie › Herstel-trend (beschrijvend, geen advies) -- */
function recoveryFlags(){
  const e=r7('energy'), st=r7('stiffness'), sl=r7('sleepHours'), rh=r7('restingHr'), hv=r7('hrv');
  const base=HISTORICAL.baselineSummary||{};
  const out=[];
  if(e!=null && e<5) out.push('ochtendenergie < 5');
  if(st!=null && st>=5) out.push('spierpijn/stijfheid ≥ 5');
  if(sl!=null && sl<6.5) out.push('slaap < 6,5 u');
  if(rh!=null && base.rhrAvg!=null && rh > base.rhrAvg+4) out.push('RHR > 4 bpm boven historisch gemiddelde');
  if(hv!=null && base.hrvAvg!=null && hv < base.hrvAvg-8) out.push('HRV duidelijk onder historisch gemiddelde');
  return out;
}
function recoveryLabel(){
  const n = recoveryFlags().length;
  return n>=2 ? 'meerdere hersteltrends wijken af van je historische gemiddelde'
       : n===1 ? 'één hersteltrend wijkt af van je historische gemiddelde'
       : 'hersteltrends in lijn met je historische gemiddelde';
}

   1. Hoe is je herstel?  2. Wat staat er vandaag?  3. Wat is de volgende stap?

/* ---- MIJN ROUTINES: iedere gebruiker zijn eigen lijst (CB.routines) ----
   Zolang er niets is opgeslagen, krijgt wie de oude vaste routines al gebruikte die twee als startlijst; een nieuwe gebruiker niets.
   De twee oude routines houden hun oude velden (checks.spiritual, routineDone/checks.routine), zodat eerdere dagen precies blijven
   wat ze waren. Nieuwe routines: dailyLogs[d].routines[id] = 'ja' | 'nee'. Verwijderen = markeren (deleted), zodat synchronisatie
   een verwijderde routine niet terugbrengt; afgevinkte dagen blijven bewaard. */
const RT_MOMENTS = [['ochtend','Ochtend'],['middag','Middag'],['avond','Avond']];
function routineList(){
  if(Array.isArray(CB.routines)){
    /* de oude standaardnaam heet voortaan kort 'Routine'; een zelfgekozen naam blijft staan */
    CB.routines.forEach(r=>{ if(r && r.id==='routine' && r.name==='Fysieke ochtendroutine') r.name = 'Routine'; });
    return CB.routines.filter(r=> r && !r.deleted);
  }
  const used = Object.values(CB.dailyLogs||{}).some(l=> l && ((l.checks && (l.checks.spiritual || l.checks.routine)) || l.routineDone));
  return used ? [ { id:'spiritual', name:'Meditatie · contemplatie · gebed', moment:'ochtend', minutes:null, perWeek:7, paused:false },
                  { id:'routine',   name:'Routine',                           moment:'ochtend', minutes:null, perWeek:7, paused:false } ] : [];
}
/* extra beweging: één aanbevolen activiteit naar keuze (bv. wandelen of fietsen), telt niet mee als taak.
   Opslag blijft dezelfde als de oude wandeling (checks.eveningWalk, eveningWalkMin), zodat eerdere dagen precies blijven.
   Niets gekozen = niet tonen; wie de wandeling al gebruikte, krijgt 'Wandeling' als startwaarde. */
const EXTRA_MOVES = ['Wandeling','Fietsen','Zwemmen'];
function extraMove(){
  if(CB.extraMove && typeof CB.extraMove==='object') return CB.extraMove.label ? String(CB.extraMove.label) : null;
  const used = Object.values(CB.dailyLogs||{}).some(l=> l && ((l.checks && l.checks.eveningWalk) || num(l.eveningWalkMin)));
  return used ? 'Wandeling' : null;
}
function extraMoveCardHTML(){
  const cur = extraMove(), other = cur && !EXTRA_MOVES.includes(cur);
  return `<div class="card" id="extraMoveCard"><h3>Extra beweging</h3>
    <p class="small muted" style="margin-top:0">Staat bij Mijn taken als optionele taak, met een gestippeld rondje. Telt niet mee in de teller.</p>
    <div class="rt-two"><div class="field"><label for="exMoveSel">Activiteit</label><select id="exMoveSel" data-exmove-sel>
      <option value="" ${!cur?'selected':''}>Geen</option>${EXTRA_MOVES.map(x=>`<option value="${x}" ${cur===x?'selected':''}>${x}</option>`).join('')}<option value="__other" ${other || ui.exMoveOther ? 'selected' : ''}>Iets anders…</option></select></div>
    ${other || ui.exMoveOther ? `<div class="field"><label for="exMoveTxt">Naam</label><input id="exMoveTxt" type="text" maxlength="40" value="${other ? esc(cur) : ''}" placeholder="bijv. Hond uitlaten, Roeien" data-exmove-txt></div>` : ''}</div></div>`;
}
function extraMoveSet(label){ CB.extraMove = { label: label ? String(label).trim().slice(0,40) || null : null }; ui.exMoveOther = false; saveState(); renderCurrent(); }
function routinesActive(){ const o = Object.fromEntries(RT_MOMENTS.map(([k],i)=>[k,i])); return routineList().filter(r=>!r.paused).map((r,i)=>[r,i]).sort((a,b)=> ((o[a[0].moment]??0)-(o[b[0].moment]??0)) || a[1]-b[1]).map(x=>x[0]); }
function routinesShown(){ return routinesActive().length > 0; }
function routineDetailShown(){ return routinesActive().some(r=> r.id==='routine'); }
function routineMinutes(r){ return r.id==='routine' ? (num(CB.routineMinutesTarget)||45) : num(r.minutes); }
/* om de dag: vanaf een eigen startdatum, doorlopend over de weken (begint niet elke maandag opnieuw) */
function routineAlt(r){ return r && /^\d{4}-\d{2}-\d{2}$/.test(String(r.altFrom||'')) ? r.altFrom : null; }
function routineDays(r){ return routineAlt(r) ? null : Array.isArray(r.days) && r.days.length ? r.days.filter(k=>DOW.includes(k)) : null; }
function routinePerWeek(r){ const ds = routineDays(r); return ds ? ds.length : Math.min(7, Math.max(1, num(r.perWeek)||7)); }
function routineFree(r){ return !routineDays(r) && !routineAlt(r); }          // elke dag, of x per week zonder vaste dagen
/* staat de routine op deze dag op het programma? vaste dagen, om de dag, of elke dag; "x per week" zonder dagen = vrij te kiezen */
function routineDueOn(r, d){
  const a = routineAlt(r); if(a) return d >= a && Math.round((Date.parse(d) - Date.parse(a)) / 864e5) % 2 === 0;
  const ds = routineDays(r); return ds ? ds.includes(dowKey(d)) : routinePerWeek(r)>=7; }
/* om de dag en gisteren niet gelukt: vandaag mag het nog (verplaatsen zonder dat het schema opschuift) */
function routineCatchUp(r, d){ const y = addDays(d, -1); return !!routineAlt(r) && !routineDueOn(r, d) && d <= todayISO() && routineDueOn(r, y) && !routineDoneOn(CB.dailyLogs[y], r); }
function routineShownOn(r, d, l){ return routineDueOn(r, d) || routineFree(r) || routineDoneOn(l, r) || routineCatchUp(r, d); }
/* weekdoel van een routine: om de dag = het aantal geplande dagen in die week (3 of 4) */
function routineTarget(r, ds){ return routineAlt(r) ? ds.filter(d=> routineDueOn(r, d)).length : routinePerWeek(r); }
const RT_PHASES = ['Oefeningen aanleren','Gewoonte opbouwen','Volhouden'];
function routineFreqText(r){
  const DL = { mon:'ma', tue:'di', wed:'wo', thu:'do', fri:'vr', sat:'za', sun:'zo' }, ds = routineDays(r);
  return routineAlt(r) ? 'om de dag' : ds ? ds.map(k=>DL[k]).join(', ') : routinePerWeek(r)>=7 ? 'elke dag' : routinePerWeek(r)+'× per week'; }
/* ===== Mijn profiel (per gebruiker, state.profile): naam, geboortedatum (→ leeftijd), startgewicht, blessures =====
   Niets persoonlijks in de code: iedere gebruiker vult dit zelf in. Pijn vraagt de Dagcheck alleen bij 'ja' (waar en hoe erg);
   komt dezelfde plek vaker terug (3× in 14 dagen), dan vraagt de app of het een blessure is — nooit vanzelf. */
const PAIN_AREAS = ['Knie','Enkel','Voet of achilles','Kuit','Scheenbeen','Hamstring','Bovenbeen of lies','Heup','Rug','Schouder'];
function profile(){ return (state.profile && typeof state.profile==='object') ? state.profile : {}; }

function profileAge(at){

  const t = at || todayISO(); let a = +t.slice(0,4) - +b.slice(0,4); if(t.slice(5) < b.slice(5)) a--;
  return a>=0 && a<120 ? a : null;
}
function injuriesActive(){ return (profile().injuries||[]).filter(x=> x && x.status==='actief' && x.area); }
function painQ(l){ l = l || {}; if(l.painAny==='ja' || l.painAny==='nee') return l.painAny; const p = num(l.pain); return p==null ? '' : p>0 ? 'ja' : 'nee'; }

const painWord = l => { const a = painAreaOf(l); return a ? 'pijn '+a.toLowerCase() : 'pijn'; };
function injurySuggest(d){
  d = d || todayISO(); const cnt = {};
  for(let i=0;i<14;i++){ const l = CB.dailyLogs[addDays(d,-i)]; if(l && num(l.pain)>0 && l.painArea) cnt[l.painArea] = (cnt[l.painArea]||0)+1; }

function injuryAdd(area, since){

}

function goalRunInfo(){

document.addEventListener('click', e=>{
  const t = e.target.closest && e.target.closest('[data-goal-choose],[data-goal-new],[data-goal-routine],[data-goal-cancel],[data-goal-save],[data-goal-edit],[data-goal-status],[data-goal-del]'); if(!t) return;

  if('goalChoose' in D){ ui.goalEdit = 'choose'; renderCurrent(); }
  else if('goalNew' in D){ ui.goalEdit = 'new'; renderCurrent(); const n = document.getElementById('goalName'); if(n) n.focus(); }
  else if('goalRoutine' in D){ ui.goalEdit = null; rtDraftStart('new'); ui.rtEdit = 'new'; showView('routines'); setTimeout(()=>{ const f = document.getElementById('rtForm'); if(f) f.scrollIntoView({ block:'start', behavior:'smooth' }); }, 30); }
  else if('goalCancel' in D){ ui.goalEdit = null; renderCurrent(); }
  else if(D.goalSave) goalSave(D.goalSave);
  else if(D.goalEdit){ ui.goalEdit = D.goalEdit; renderCurrent(); }
  else if(D.goalStatus){ const [id, st] = D.goalStatus.split('|'); goalSetStatus(id, st); }
  else if(D.goalDel){ const g = goalsAll().find(x=> x.id===D.goalDel); if(g && confirm(`"${g.name}" verwijderen?`)){ g.deleted = true; g.updatedAt = new Date().toISOString(); saveState(); renderCurrent(); } }   // gemarkeerd, zodat synchroniseren hem niet terugzet
});

  else { const el = document.getElementById('rtpVal'); if(el){ const v = num(el.value); if(v!=null && v>=0) s.val = Math.round(v); } }

function rtPlayGo(dir){

  const s = rtStep(); if(s && s.t && s.t.start){ s.t.acc = rtElapsed(s.t); s.t.start = null; }
  P.i = Math.max(0, Math.min(P.steps.length, P.i + dir)); rtPlayRender();

function rtExMove(i, to){

  const t = Math.max(0, Math.min(xs.length, to)), j = t > i ? t-1 : t; if(j===i) return false;
  const [m] = xs.splice(i, 1); xs.splice(j, 0, m); renderCurrent(); return j;

/* één manier van verslepen voor lijsten (routine-oefeningen, Mijn taken): muis = meteen slepen; telefoon = aan het greepje,
   of even vasthouden; toetsenbord = op het greepje pijl omhoog/omlaag. c: { list, attr (index op de li), grip, ghost, host, prep, move } */
function listDrag(c){
  const D = { i:null, active:false, ghost:null, to:null, timer:null, eat:false }, liSel = c.list+' li['+c.attr+']';
  const rows = () => [...document.querySelectorAll(liSel)], idx = li => Number(li.getAttribute(c.attr));
  function start(){
    const li = rows().find(x=> idx(x)===D.i); if(!li){ D.i = null; return; }
    const r = li.getBoundingClientRect(); D.active = true; D.dx = D.x0 - r.left; D.dy = D.y0 - r.top;
    const g = document.createElement('div'); g.className = c.ghost; g.innerHTML = li.innerHTML; if(c.prep) c.prep(g, li);
    g.querySelectorAll('['+c.grip+']').forEach(x=> x.removeAttribute(c.grip));
    g.style.width = r.width+'px'; g.style.transform = `translate(${r.left}px, ${r.top}px)`; ((c.host && li.closest(c.host)) || document.body).appendChild(g); D.ghost = g; li.classList.add('run-dragging');
    try { if(D.touch && navigator.vibrate) navigator.vibrate(12); } catch(e){}
  }
  function move(x, y){
    D.ghost.style.transform = `translate(${x - D.dx}px, ${y - D.dy}px)`;
    const rs = rows(); rs.forEach(li=> li.classList.remove('rt-before','rt-after'));
    let to = rs.length; for(const li of rs){ const r = li.getBoundingClientRect(); if(y < r.top + r.height/2){ to = idx(li); break; } }
    D.to = (to===D.i || to===D.i+1) ? null : to;
    if(D.to!=null){ if(to < rs.length) rs[to].classList.add('rt-before'); else rs[rs.length-1].classList.add('rt-after'); }
    if(y < 80) window.scrollBy(0, -14); else if(y > innerHeight - 80) window.scrollBy(0, 14);
  }
  function end(drop){
    clearTimeout(D.timer);
    if(D.active){
      if(D.ghost) D.ghost.remove(); rows().forEach(li=> li.classList.remove('rt-before','rt-after','run-dragging'));
      D.eat = true; setTimeout(()=>{ D.eat = false; }, 400);
      if(drop && D.to!=null){ const i = D.i, to = D.to; Object.assign(D, { i:null, active:false, ghost:null, to:null }); c.move(i, to); return; }
    }
    Object.assign(D, { i:null, active:false, ghost:null, to:null });
  }
  document.addEventListener('pointerdown', e=>{
    const li = e.target.closest && e.target.closest(liSel); if(!li || e.button>0) return;
    const grip = e.target.closest('['+c.grip+']'); if(!grip && e.target.closest('select,button,input,textarea,a')) return;
    D.i = idx(li); D.x0 = e.clientX; D.y0 = e.clientY; D.active = false; D.touch = e.pointerType!=='mouse';
    if(D.touch && grip && !c.hold){ e.preventDefault(); start(); }
    else if(D.touch) D.timer = setTimeout(start, c.hold || 380);          // c.hold: ook aan het greepje eerst even vasthouden
  });
  document.addEventListener('pointermove', e=>{
    if(D.i==null) return;
    if(!D.active){
      const moved = Math.hypot(e.clientX-D.x0, e.clientY-D.y0);
      if(D.touch){ if(moved>10){ clearTimeout(D.timer); D.i = null; } return; }          // eerst bewegen = gewoon scrollen
      if(moved<6) return; start(); if(!D.active) return;
    }
    e.preventDefault(); move(e.clientX, e.clientY);
  }, { passive:false });
  document.addEventListener('touchmove', e=>{ if(D.active) e.preventDefault(); }, { passive:false });
  document.addEventListener('pointerup', ()=>{ if(D.i!=null) end(true); });
  document.addEventListener('pointercancel', ()=>{ if(D.i!=null) end(false); });
  document.addEventListener('click', e=>{ if(D.eat && e.target.closest && e.target.closest(c.list)){ e.preventDefault(); e.stopPropagation(); D.eat = false; } }, true);
  document.addEventListener('keydown', e=>{
    const g = e.target.closest && e.target.closest(c.list+' ['+c.grip+']'); if(!g || (e.key!=='ArrowUp' && e.key!=='ArrowDown')) return;
    e.preventDefault(); const i = Number(g.getAttribute(c.grip)), j = c.move(i, e.key==='ArrowUp' ? i-1 : i+2);
    if(j!==false){ const n = document.querySelector(`${c.list} [${c.grip}="${j}"]`); if(n) n.focus(); }
  });
  return D;
}

/* de stand van één dag voor Vandaag: herstel (zoals beoordeeld), training van die dag en de volgende training.
   Eén bron voor het mobiele blok en de desktopkaarten, zodat kleur en tekst overal hetzelfde zeggen. */
function todayState(d, ctx){
  const isToday = d===todayISO(), l = CB.dailyLogs[d] || {};
  const own = l.traffic && DAY_STATUS[l.traffic] ? l.traffic : null;
  let status, why = [], und, vals, onlyMissing = '';
  if(isToday){ const rd = runReadiness(d); und = rd.undetermined && !own; status = und ? null : (rd.undetermined ? own : rd.shown); why = rd.reasons.concat(rd.missing.map(t=>({ sev:'info', text:t }))); vals = rd.values;
    // oranje alleen door ontbrekende gegevens: zeg meteen welke (anders lijken goede waarden met oranje tegenstrijdig)
    if(status==='orange' && !own && !rd.reasons.some(r=>r.sev!=='info') && rd.missing.length)
      onlyMissing = /^Evaluatie/.test(rd.missing[rd.missing.length-1]) ? 'de vragen bij je vorige training nog niet zijn ingevuld' : /^Nog geen eerdere/.test(rd.missing[rd.missing.length-1]) ? 'er nog geen eerdere training is om op te bouwen' : 'er gegevens ontbreken'; }
  else { const a = l.advice; status = a ? strictestStatus(a.status, own) : own; und = !status; why = a ? (a.reasons||[]).map(t=>({ sev:'info', text:t })) : []; vals = dayAdvice(d).readiness.values; }
  const rp = RP(), ses = rp.sessions.filter(s=> s.date===d && s.status!=='cancelled').sort(runByDate);
  const planned = ses.find(s=>s.status==='planned'), done = ses.find(s=>s.status==='done');
  const other = (!planned && !done && ctx.primary && ctx.primary.type!=='coach') ? ctx.primary : null;
  const next = rp.settings.paused ? null : rp.sessions.filter(s=> s.status==='planned' && s.date>d).sort(runByDate)[0];
  const head = (planned || other) ? TODAY_HEAD.train : TODAY_HEAD.rest;
  return { d, isToday, l, own, status, why, und, vals, onlyMissing, planned, done, other, next, head };
}

/* mijn taken: afgeleid uit wat Atempo al weet (geen eigen takenlijst); afvinken = dezelfde registratie als altijd */
function tdTasks(st, ctx){
  const { d, l, planned, done, other, isToday } = st, checks = l.checks || {}, out = [];
  /* Dagcheck en Slaap als taak (tellen allebei mee): vinkje zodra ingevuld; klikken opent het paneel bij Mijn herstel.
     Dagcheck ingevuld = dezelfde regel als het advies (energie, pijn, wandelen/traplopen); Slaap = RHR, HRV en slaap (zelf of Garmin) */
  const showOc = d <= todayISO(), g = state.garmin.daily[d] || {}, has = v => v!=null && v!=='';
  if(showOc) out.push({ k:'dc', done: runPreComplete(runPre(d)), html:`<button class="td-link" data-oc-panel="dc">Dagcheck</button>` });
  if(planned) out.push({ k:'run', done:false, html:`<button class="td-link" data-run-open="${planned.id}">Hardlooptraining · ${esc(planned.name.replace(/ – .*/, ''))}</button>` });
  if(done){ out.push({ k:'run', done:true, html:'Hardlooptraining' });
    out.push(runPostComplete(done.post) ? { k:'eval', done:true, html:'Training geëvalueerd' } : { k:'eval', done:false, html:`<button class="td-link" data-run-open="${done.id}">Training evalueren</button>` }); }
  if(other) out.push({ k:'other', done:false, html:`<button class="td-link" data-add="${other.type}|${d}">${esc(other.label)}</button>` });
  ['strengthA','strengthB','longwalk','learning'].forEach(k=>{ if(ctx.logged && ctx.logged[k] && !(other && other.type===k)) out.push({ k:'reg:'+k, done:true, html: ({ strengthA:'Kracht A', strengthB:'Kracht B', longwalk:'Lange wandeling', learning:'Leermoment' })[k] }); });
  /* afgevinkt: geen Start en geen 'deels / afwijkend' meer; via › kun je de registratie nog bekijken of aanpassen */
  routineToday(d, l).forEach(r=>{ const dn = routineDoneOn(l, r); out.push({ k:'rt:'+r.id, done:dn, check:true, html: routineCheckHTML(r, l, null, true), ...(rtExercises(r).length ? { go:'reg', goAttr:`data-rt-reg="${esc(r.id)}"`, play: !dn && d <= todayISO() ? r.id : null } : {}) }); });
  if(showOc) out.push({ k:'slaap', done: (has(l.restingHr)||has(g.restingHr)) && (has(l.hrv)||has(g.nightHrv)) && (has(l.sleepHours)||has(g.sleepDuration)),
    html:`<button class="td-link" data-oc-panel="more">Slaap</button>` });
  const xm = extraMove(); if(xm || checks.eveningWalk) out.push({ k:'extra', done:!!checks.eveningWalk, check:true, optional:true, html:`<label><input type="checkbox" data-check="eveningWalk"${checks.eveningWalk?' checked':''}> ${esc(xm || 'Extra beweging')} <span class="td-opt">(optioneel)</span></label>${checks.eveningWalk ? `<div class="td-dur">${fInput('Duur (min)','currentBlock.dailyLogs.'+d+'.eveningWalkMin', l.eveningWalkMin,'number','inputmode="numeric"')}</div>` : ''}` });
  return taskSort(out);
}
/* eigen volgorde van Mijn taken (CB.taskOrder, per gebruiker): taken die erin staan krijgen die volgorde,
   nieuwe taken blijven op hun gewone plek */
function taskSort(list){
  const ord = Array.isArray(CB.taskOrder) ? CB.taskOrder : [], known = list.filter(x=> ord.includes(x.k)).sort((a,b)=> ord.indexOf(a.k) - ord.indexOf(b.k));
  let n = 0; return list.map(x=> ord.includes(x.k) ? known[n++] : x);
}
function taskMove(i, to){
  const keys = [...document.querySelectorAll('.td-tasks .td-tasklist li[data-tk-i]')].map(li=> li.dataset.tk);
  if(!keys[i]) return false;
  const t = Math.max(0, Math.min(keys.length, to)), j = t > i ? t-1 : t; if(j===i) return false;
  const [m] = keys.splice(i, 1); keys.splice(j, 0, m);
  CB.taskOrder = [...keys, ...(CB.taskOrder||[]).filter(k=> !keys.includes(k))];   // taken van andere dagen houden hun plek in de lijst
  saveState(); renderCurrent(); return j;
}

function biggestAsymmetry(){
  const M = CB.measurements.baseline; let best=null;
  for(const def of kpiDefs().filter(x=>x.asym)){
    const L=num(M[def.key+'L']), R=num(M[def.key+'R']);
    if(L!=null&&R!=null){ const diff=Math.abs(L-R); if(!best||diff>best.val) best={ val:diff, label:`${def.label} (W0)` }; }

  return best;

/* ---------- Deze week op de desktop (Design 3.0) ----------
   Weekintroductie, maximaal drie voortgangskaarten (alleen wat deze week voor jou geldt), Atempo Coach, zeven dagkaarten
   en de uitklapbare onderdelen. Dezelfde berekeningen als hierboven (weekStatus, weekPlan, weekMinutes); geen eigen telling.
   Een dagkaart toont de status van de dag (afgerond, gepland, vandaag, voorstel, aandacht, rustdag) en apart het herstel. */
function weekCoachLine(wi, ws, ds){
  const today = todayISO(), inWeek = ds[0] <= today && today <= ds[6], rp = RP();
  const doneHere = rp.sessions.filter(s=> s.status==='done' && s.date>=ds[0] && s.date<=ds[6]).sort(runByDate);
  const last = runDoneSessions().filter(s=> s.date<=(inWeek ? today : ds[6])).pop();
  const n = ws.coach.target, x = ws.coach.done;
  if(inWeek && runReadiness(today).shown==='red') return ['red', 'Je herstel vraagt vandaag om rust. Je training kun je verzetten.'];
  if(last && runOutcome(last).state==='bad') return ['orange', 'Je vorige training ging minder goed. Houd het niveau zoals het is.'];
  const open = doneHere.find(s=> runOutcome(s).state==='incomplete');
  if(open) return ['orange', `Vul de vragen bij je training van ${fmt(open.date,{weekday:'long'})} in; dan kan de coach je opbouw beoordelen.`];
  if(n!=null && x>=n && n>0) return ['green', `Je hebt alle ${n} hardlooptrainingen van deze week gedaan.`];
  if(ds[0] > today) return ['none', n ? `Deze week staan ${n} hardlooptrainingen gepland.` : 'Voor deze week staat nog niets gepland.'];
  if(n!=null){
    const nx = inWeek ? rp.sessions.filter(s=> s.status==='planned' && s.date>=today && s.date<=ds[6]).sort(runByDate)[0] : null;
    return ['none', `Je hebt ${x} van de ${n} hardlooptrainingen gedaan.` + (nx ? ` Volgende: ${fmt(nx.date,{weekday:'long'})}.` : '')];
  }
  return ['none', 'Deze week staat er geen hardlooptraining gepland.'];
}

  const evLine = ev && /uitbreiden/i.test(ev.advice) && ev.nextTpl ? `<p class="td-sub">Je kunt overwegen naar ${esc(ev.nextTpl.name)} te gaan. Dat beslis je zelf, bij Hardlopen.</p>` : '';
  // dagkaarten
  const S = { done:'Afgerond', attention:'Aandacht nodig', today:'Vandaag', planned:'Gepland', suggested:'Voorstel', rest:'Rustdag' };
  const HL = { green:'Herstel: groen', orange:'Herstel: rustig aan', red:'Herstel: herstel gaat voor' };
  const day = dt => {
    const dk = dowKey(dt), acts = [], sess = rp.sessions.filter(s=> s.date===dt && s.status!=='cancelled').sort(runByDate);
    let attention = false, anyDone = false, anyPlanned = false, sugg = false;
    sess.forEach(s=>{ const z = runHrZoneOf(s);
      acts.push({ t:'Hardlopen', m:`${s.name.replace(/ – .*/, '')}${z ? ' · '+runHrZone(z)[1] : ''} · ${runMinLabel(runTotals(s.steps).total)}` });
      if(s.status==='done'){ anyDone = true; if(runOutcome(s).state==='incomplete') attention = true; }
      else if(s.status==='planned'){ anyPlanned = true; if(dt < today) attention = true; }
      else if(s.status==='skipped') acts[acts.length-1].m += ' · overgeslagen'; });
    allRunRecords().filter(r=> r.date===dt && !r._program).forEach(r=>{ acts.push({ t:'Hardlopen', m:'Garmin Coach-run' + (r.totalMin!=null ? ' · '+nl(r.totalMin)+' min' : '') }); if(r.done===true) anyDone = true; });
    /* routines staan op hun eigen regel (zon), niet ook nog als activiteit */
    CB.strengthSessions.filter(s=>s.date===dt).forEach(s=>{ anyDone = true; if(s.session!=='R') acts.push({ t:'Kracht '+s.session, m:s.durationMin!=null ? nl(s.durationMin)+' min' : 'gedaan' }); });
    CB.walks.filter(w=>w.date===dt).forEach(w=>{ acts.push({ t:'Lange wandeling', m:w.totalMin!=null ? nl(w.totalMin)+' min' : 'gedaan' }); anyDone = true; });
    (CB.learningSessions||[]).filter(x=>x.date===dt).forEach(x=>{ acts.push({ t:'Leermoment', m:exName(x.exerciseId) }); anyDone = true; });
    if(cfg.strengthA && wp.strengthADay===dk && !ws.strengthA.done && dt>=today){ acts.push({ t:'Kracht A', m:'voorstel' }); sugg = true; }
    if(cfg.strengthB && wp.strengthBDay===dk && !ws.strengthB.done && dt>=today){ acts.push({ t:'Kracht B', m:'voorstel' }); sugg = true; }
    if(isLongWalkWeek(wi) && wp.longWalkDay===dk && !ws.longWalk.done && dt>=today){ acts.push({ t:'Lange wandeling', m:'voorstel' }); sugg = true; }
    /* routines van die dag (zoals op Vandaag), plus wat die dag is afgevinkt; ✓ als alles gedaan is */
    const lg = CB.dailyLogs[dt], rDay = showR ? ws.routines.map(x=>x.r).filter(r=> routineDoneOn(lg, r) || routineToday(dt, lg).some(y=>y.id===r.id)) : [];
    const rDone = rDay.filter(r=> routineDoneOn(lg, r)).length, rAll = rDay.length && rDone===rDay.length;
    const routine = !rDay.length ? '' : rDay.length===1 ? rDay[0].name+(rAll ? ' ✓' : '') : rAll ? 'Routines ✓' : dt > today ? rDay.length+' routines' : `Routines ${rDone}/${rDay.length}`;
    const st = attention ? 'attention' : dt===today ? 'today' : anyPlanned ? 'planned' : anyDone ? 'done' : sugg ? 'suggested' : 'rest';
    const hs = dt > today ? null : effectiveDayStatus(dt);
    const hText = dt > today ? 'Herstel: nog niet bekend' : (hs ? HL[hs] : 'Herstel: niet ingevuld');
    const label = `${DOW_NL[dk]} ${fmt(dt,{day:'numeric',month:'short'})}`;
    const shown = acts.slice(0,2), more = acts.length - shown.length;
    return `<a href="#" class="wk-day st-${st}" data-open-day="${dt}" aria-label="${esc(fmt(dt,{weekday:'long',day:'numeric',month:'long'}))}: ${esc(S[st])}${acts.length ? ', '+esc(acts.map(a=>a.t).join(', ')) : ''}. ${esc(hText)}">
      <div class="wk-day-h"><span>${esc(label)}</span>${st==='done' ? '<i class="wk-mark ok" aria-hidden="true">✓</i>' : st==='attention' ? '<i class="wk-mark warn" aria-hidden="true">!</i>' : ''}</div>
      ${shown.map(a=>`<div class="wk-act">${TD_ICO(/^Kracht/.test(a.t) ? TDI.dumb : /wandeling/i.test(a.t) ? TDI.walk : /Leermoment/.test(a.t) ? TDI.list : TDI.run, 'wk-act-ic')}<b>${esc(a.t)}</b><span>${esc(a.m)}</span></div>`).join('')}${more>0 ? `<div class="wk-more">+${more} meer</div>` : ''}
      ${!acts.length ? '<div class="wk-act wk-rest"><span class="wk-dash" aria-hidden="true">—</span><b>Rustdag</b></div>' : ''}
      ${routine ? `<div class="wk-routine${rAll ? ' done' : ''}">${TD_ICO(TDI.sun)}${esc(routine)}</div>` : ''}
      ${st==='rest' ? '<span class="wk-pill-gap"></span>' : `<span class="wk-pill st-${st}">${st==='done' ? '✓ ' : ''}${esc(S[st])}</span>`}
      <span class="wk-h st-${hs||'none'}"><i aria-hidden="true"></i>${esc(hText)}</span></a>`;
  };
  const sum = (title, right, ico) => `<summary class="wk-sum"><span class="wk-sum-ico">${TD_ICO(ico)}</span><span class="wk-sum-t">${title}</span><span class="wk-sum-r">${right}</span>${TD_ICO(TDI.chev, 'wk-sum-chev')}</summary>`;
  const goalSum = [ws.coach.target!=null ? `${ws.coach.done} van ${ws.coach.target} hardlooptrainingen` : null, kr.length ? `kracht ${kr.filter(x=>x.done).length} van ${kr.length}` : null,
    ws.longWalk.applicable ? (ws.longWalk.done ? 'lange wandeling gedaan' : 'lange wandeling nog te doen') : null, showR ? `routines ${ws.routines.reduce((a,x)=>a+x.done,0)}× afgevinkt` : null].filter(Boolean).join(' · ');
  const inner = s => s ? s.replace(/^<details class="acc"><summary>[\s\S]*?<\/summary>/, '').replace(/<\/details>\s*$/, '') : '';
  const weekOpts = Array.from({length:blockWeeks()},(_,i)=>{ const d2 = weekDates(i); return `<option value="${i}" ${i===wi?'selected':''}>Week ${weekNo(i)} · ${esc(fmt(d2[0],{day:'numeric',month:'short'}))} – ${esc(fmt(d2[6],{day:'numeric',month:'short'}))}</option>`; }).join('');
  return `<div class="td wk sf-rust">
    <section class="td-hero wk-hero">${TD_HERO}<div class="td-hero-fade"></div>
      <div class="td-hero-text"><span class="wk-pillweek">WEEK ${weekNo(wi)}</span>
        <h2 class="td-greet">Week ${weekNo(wi)} — ${esc(phaseLabel)}</h2>
        <div class="td-date wk-date">${TD_ICO(TDI.cal)}${esc(fmt(ds[0],{day:'numeric',month:'long'}))} – ${esc(fmt(ds[6],{day:'numeric',month:'long'}))}</div>
        ${cfg.learningGoal ? `<p class="wk-goal">${esc(cfg.learningGoal)}</p>` : ''}</div>
    </section>
    <div class="wk-top">
      ${cards.length ? `<div class="wk-progs" style="grid-template-columns:repeat(${Math.min(3, cards.length)},minmax(0,1fr))">${cards.slice(0,3).map(cardHTML).join('')}</div>` : ''}
      <section class="td-card td-coach st-${cs} wk-coach" aria-labelledby="wkCoachH"><div class="td-coach-top"><span class="td-coach-title" id="wkCoachH">${TD_ICO(TDI.spark, 'td-spark')}Atempo Coach</span></div>
        <div class="td-coach-body">${cs==='green' ? `<span class="wk-okdot" aria-hidden="true">✓</span>` : `<span class="td-dot st-${cs}" aria-hidden="true"></span>`}<div><p class="td-coach-text">${esc(ctext)}</p>${evLine}</div></div></section>
    </div>
    <section aria-labelledby="wkPlanH">
      <div class="wk-plan-h"><h3 id="wkPlanH">Weekplanning</h3>
        <div class="wk-nav no-print">
          <button class="btn sm" data-week="${Math.max(0, wi-1)}" aria-label="Vorige week" ${wi===0?'disabled':''}>${TD_ICO('<path d="m15 6-6 6 6 6"></path>')}</button>
          <label class="td-hidden-sr" for="wkSel">Kies een week</label><select id="wkSel" data-week-select>${weekOpts}</select>
          <button class="btn sm" data-week="${Math.min(blockWeeks()-1, wi+1)}" aria-label="Volgende week" ${wi===blockWeeks()-1?'disabled':''}>${TD_ICO(TDI.chev)}</button>
        </div></div>
      <div class="wk-days">${ds.map(day).join('')}</div>
      <p class="td-sub">Tik op een dag om hem te openen. Onderaan elke dag staat je herstel, los van de training.</p>
    </section>
    ${conflicts.length ? `<div class="td-card wk-warn"><b>Aandachtspunten</b>${conflicts.map(c=>`<div class="td-note st-orange">${esc(c)}</div>`).join('')}<p class="td-sub">Signalering, geen blokkade. Jij beslist.</p></div>` : ''}
    <div class="wk-acc">
      <details class="td-card wk-det">${sum('Weekdoelen', esc(goalSum), TDI.target)}<div class="wk-det-b"><div class="week-track">${goalRows}</div>${inner(parts.voorstel)}</div></details>
      <details class="td-card wk-det">${sum('Trainingstijd deze week', esc(mins.doneTotal+' min uitgevoerd'), TDI.bars)}<div class="wk-det-b">${inner(parts.tijd)}</div></details>
      <details class="td-card wk-det">${sum('Blokinstellingen', esc(blockWeeks()+' weken · start '+fmt(blockStart(),{day:'numeric',month:'long'})), TDI.layers)}<div class="wk-det-b">${inner(parts.blok)}</div></details>
    </div>
  </div>`;
}

/* Geregistreerde training = inklapbare kaart. Standaard open bij nieuw
   registreren; daarna kun je hem inklappen tot een samenvattingsregel.
   De open/dicht-keuze zit in ui.collapsedCards zodat hij een herrender overleeft. */
function regCard(border, titleHtml, body, key, forceOpen, summary){
  const open = forceOpen || !ui.collapsedCards[key];
  return `<details class="card regcard" data-cardkey="${esc(key)}"${open?' open':''} style="border-color:${border}">
    <summary><span class="rc-title">${titleHtml}</span>${summary?`<span class="rc-sum">${esc(summary)}</span>`:''}</summary>
    <div class="rc-body">${body}</div>
  </details>`;
}
function mInput(label,path,val,unit='',mode='decimal',extra=''){
  return `<div class="field"><label>${esc(label)}${unit?` <span class="tny">(${esc(unit)})</span>`:''}</label><input type="number" inputmode="${mode}" data-bind="${path}" value="${val==null?'':esc(val)}" ${extra}></div>`;
}
function mText(label,path,val,ph=''){
  return `<div class="field"><label>${esc(label)}</label><input type="text" data-bind="${path}" value="${val==null?'':esc(val)}"${ph?` placeholder="${esc(ph)}"`:''}></div>`;
}
function mSelect(label,path,val,opts){
  return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
}

/* Bestaande trainingen beheren vanuit "Iets anders gedaan? / training aanpassen":
   verzetten (alleen de datum verandert, alle overige velden incl. garminExternalId blijven)
   of verwijderen. Geen nieuw record, geen kopie. */
const MOVE_ARRAYS = { coach:'coachRuns', strength:'strengthSessions', walk:'walks', learning:'learningSessions' };
function moveRecordDate(kind, id, newDate){
  if(!isoDate(newDate)) { alert('Ongeldige datum.'); return; }
  if(newDate > todayISO()){ alert('Een training kun je niet naar een datum in de toekomst verplaatsen — je kunt hem daar immers nog niet gedaan hebben.'); return; }
  const arr = CB[MOVE_ARRAYS[kind]];
  const rec = arr && arr.find(x=>x.id===id);
  if(!rec) return;
  rec.date = newDate;
  arr.sort((a,b)=> a.date.localeCompare(b.date));
  ui.moveOn = null;
  ui.date = clampToBlock(newDate);   // meteen naar de nieuwe datum, zodat de verplaatsing zichtbaar bevestigd wordt
  ui.weekIdx = Math.max(0, weekIndexFor(ui.date));
  saveState(); renderCurrent();
}
function deleteRecordById(kind, id){
  const arr = CB[MOVE_ARRAYS[kind]];
  const i = arr ? arr.findIndex(x=>x.id===id) : -1;
  if(i<0) return;
  arr.splice(i,1);
  ui.moveOn = null;
  saveState(); renderCurrent();
}

      ${mText('Type Coach-training',p+'type', r.type,'bv. easy run / tempo')}

      ${mSelect('Uitgevoerd',p+'done', idx>=0?(r.done===true?'ja':r.done===false?'nee':''):(r.done??''), [['','— nog niet bekend'],['ja','ja'],['nee','nee']])}

      ${mInput('Aaneengesloten looptijd — KPI',p+'continuousMin', r.continuousMin,'min','decimal')}
      ${mInput('Afstand',p+'distanceKm', r.distanceKm,'km')}
      ${mText('Gem. bewogen tempo',p+'avgPace', r.avgPace,'6:13')}
      ${mInput('Gem. HR',p+'avgHr', r.avgHr,'','numeric')}

    <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    ${idx<0?`<button class="btn primary" data-commit="coach|${d}">Coach-run opslaan</button> <button class="btn sm" data-add-cancel>Annuleren</button>`
           :`<button class="btn danger sm" data-delete="coach|${idx}">Verwijderen</button> <span class="tny muted">Wijzigingen automatisch opgeslagen · datum aanpassen kan via "Iets anders gedaan? / training aanpassen".</span>`}
    </div>`;
  return regCard('#bcd6e5', runCoachWord()+' — '+esc(fmt(d,{weekday:'long',day:'numeric',month:'long'})), body, 'coach|'+d, ui.addOn===d && ui.addType==='coach', summary);

function strengthCard(d, session){
  const idx = CB.strengthSessions.findIndex(s=> s.date===d && s.session===session);
  const s = idx>=0 ? CB.strengthSessions[idx] : { date:d, session, entries:{} };
  const exs = state.exercises.filter(x=> x.session===session && (x.kind==='strength'||x.kind==='time'));
  const p = idx>=0 ? `currentBlock.strengthSessions.${idx}.` : `__d.strength.${d}.${session}.`;
  const blocks = exs.map(ex=>{
    const e = (s.entries&&s.entries[ex.id]) || {};
    const b = p+`entries.${ex.id}.`;
    const advice = idx>=0 ? progressionAdvice(ex) : [];
    const wLabel = ex.kind==='time' ? 'Seconden' : 'Gewicht';
    const wUnit = ex.kind==='time' ? 'sec' : 'kg';
    const repLabel = ex.kind==='time' ? 'Sec per set' : 'Reps per set';
    const load = ex.lr
      ? `${mInput(wLabel+' L',b+'weightL', e.weightL, wUnit)}
         ${mText(repLabel+' L',b+'setRepsL', e.setRepsL,'12, 12')}
         ${mInput(wLabel+' R',b+'weightR', e.weightR, wUnit)}
         ${mText(repLabel+' R',b+'setRepsR', e.setRepsR,'12, 11')}`
      : `${mInput(wLabel,b+'weight', e.weight, wUnit)}
         ${mInput('Sets',b+'sets', e.sets,'','numeric')}
         ${mText(repLabel,b+'setReps', e.setReps,'12, 12')}
         <div class="field"></div>`;
    return `<div style="border:1px solid var(--line2);border-radius:11px;padding:12px;margin:8px 0">

      </div>
      ${advice.map(a=> a.msg?`<div class="advice">${esc(a.msg)}</div>`:`<div class="tny muted" style="margin-top:4px">${esc(a.note)}</div>`).join('')}
      <div class="form-grid cols-4" style="margin-top:8px">${load}</div>
      <div class="form-grid cols-2" style="margin-top:8px">
        ${mInput('RIR laatste set',b+'rir', e.rir,'0–5','numeric')}
        ${mSelect('Techniek',b+'tech', e.tech, [['','—'],['goed','goed'],['minder','minder goed']])}
      </div>
    </div>`;
  }).join('');
  const body = `
    <div class="form-grid cols-2" style="margin-bottom:4px">
      ${mInput('Sessieduur',p+'durationMin', s.durationMin,'min','decimal')}
      <div class="field"><label>&nbsp;</label><div class="tny muted">RIR = herhalingen in reserve. Meer weerstand bij dezelfde techniek is progressie — ook als het aantal reps daalt.</div></div>
    </div>
    ${blocks}
    ${fText('Sessie-notitie (links/rechts-gevoel, bijzonderheden)', p+'note', s.note)}
    ${idx<0?`<button class="btn primary" data-commit="strength|${d}|${session}">Kracht ${session} opslaan</button> <button class="btn sm" data-add-cancel>Annuleren</button>`
           :`<button class="btn danger sm" data-delete="strength|${idx}">Verwijderen</button>
             <p class="tny muted" style="margin-top:8px">Double progression ${exs[0]?.range?exs[0].range.join('–'):'6–12'}: alle sets aan de bovengrens met RIR ≥ 2, twee sessies achtereen → één stap zwaarder, terug naar de onderkant. Eén variabele per keer. De app adviseert; jij beslist.</p>`}`;
  const summary = idx>=0 ? [s.durationMin!=null&&nl(s.durationMin)+' min', Object.keys(s.entries||{}).length+' oefeningen'].filter(Boolean).join(' · ') : '';
  return regCard('#d5c8e6', 'Kracht '+session+' — '+esc(fmt(d,{weekday:'long',day:'numeric',month:'long'})), body, 'strength'+session+'|'+d, ui.addOn===d && ui.addType==='strength'+session, summary);

/* velden die "vorige waarde als grijze richtwaarde" ondersteunen — uitsluitend de
   routinemetingen, nooit subjectieve dagvelden en nooit de notitie (zie UX-correctie). */
const ROUTINE_DETAIL_FIELDS = ['pushupReps','pushupTech','pushupRpe','forwardBendReps','forwardBendFloor',
  'balanceReachL','balanceReachR','balanceRvsL','legRaiseReps','toeTouchReps','ohpL','ohpR'];
/* meest recente eerdere waarde per veld, strikt vóór datum d — nooit vandaag of later,
   en per veld apart gezocht (niet blind één vorige dag kopiëren). */
function prevRoutineValue(field, d){
  const ds = Object.keys(CB.dailyLogs).filter(x=> x < d).sort();
  for(let i=ds.length-1;i>=0;i--){
    const v = CB.dailyLogs[ds[i]]?.routineDetail?.[field];
    if(v!=null && v!=='') return { value:v, date:ds[i] };
  }
  return null;
}
function relativeDayLabel(dateStr, refDate){
  const diff = Math.round((parseDate(refDate)-parseDate(dateStr))/86400000);
  if(diff===1) return 'gisteren';
  if(diff===2) return 'eergisteren';
  return fmt(dateStr,{day:'numeric',month:'short'});
}
/* "Vorige waarden overnemen" — vult per leeg veld de laatst bekende waarde in als concept
   voor vandaag. Dit IS de bevestiging (expliciete klik); daarna gewoon aanpasbaar/opslaanbaar
   via de bestaande invoerlogica. Nooit de notitie, nooit velden die al een waarde hebben. */
function applyPreviousRoutineValues(d){
  const rd = ensureLog(d).routineDetail = ensureLog(d).routineDetail || {};
  for(const f of ROUTINE_DETAIL_FIELDS){
    if(rd[f]==null || rd[f]===''){
      const prev = prevRoutineValue(f, d);
      if(prev) rd[f] = prev.value;
    }
  }
  saveState(); renderToday();
}

/* ===========================================================================
   DRAFT-BEHEER + COMMIT
   =========================================================================== */
let _draft = {};
function draftSet(parts, val){
  let ptr = _draft;
  for(let i=1;i<parts.length-1;i++){ ptr[parts[i]] = ptr[parts[i]] || {}; ptr = ptr[parts[i]]; }
  ptr[parts[parts.length-1]] = (val===''?null:val);
}
function draftGet(path){ return path.split('.').reduce((o,k)=> (o&&o[k]!=null)?o[k]:undefined, _draft); }
function normNums(o){ const out={}; for(const [k,v] of Object.entries(o||{})){
  if(k==='entries'){ const e={}; for(const [id,vals] of Object.entries(v||{})) e[id]=normNums(vals); out[k]=e; continue; }
  out[k] = coerce(k, v); } return out; }
function ensureLog(d){ return CB.dailyLogs[d] = CB.dailyLogs[d] || {}; }
/* canonical = dailyLogs[d].routineDone ('ja'|'deels'|'nee'|''); checks.routine blijft
   compatibel uitleesbaar voor oude records. 'ja' en 'deels' tellen als routinedag. */
function routineDoneish(l){ return !!(l && (l.routineDone==='ja' || l.routineDone==='deels' || (l.checks && l.checks.routine))); }

function commitDraft(spec){
  const [kind, a, b] = spec.split('|');
  if(isoDate(a) && a > todayISO()){ alert('Je kunt geen training registreren op een datum in de toekomst. Registreer op de dag zelf of daarna.'); return; }
  if(kind==='coach'){
    const d = (draftGet('coach.'+a)) || {};
    const rec = { id:'c'+Date.now().toString(36), date:a, ...normNums(d) };
    // 3 echte toestanden: 'ja'->true, 'nee'->false, leeg/anders->null (nog niet bekend)
    rec.done = d.done==='ja' ? true : d.done==='nee' ? false : null;
    CB.coachRuns.push(rec); CB.coachRuns.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.coach) delete _draft.coach[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='strength'){
    const d = (draftGet(`strength.${a}.${b}`)) || {};
    const entries = {};
    for(const [exId,vals] of Object.entries(d.entries||{})) entries[exId] = normNums(vals);
    CB.strengthSessions.push({ id:'s'+Date.now().toString(36), date:a, session:b, entries, note:d.note||'', durationMin: num(d.durationMin) });
    CB.strengthSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.strength && _draft.strength[a]) delete _draft.strength[a][b];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='walk'){
    const d = (draftGet('walk.'+a)) || {};
    CB.walks.push({ id:'w'+Date.now().toString(36), date:a, ...normNums(d) });
    CB.walks.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.walk) delete _draft.walk[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='learning'){
    const d = (draftGet('learning.'+a)) || {};
    const wi = Math.max(0, weekIndexFor(a));
    const rec = { id:'l'+Date.now().toString(36), date:a, ...normNums(d) };
    if(!rec.exerciseId) rec.exerciseId = weekConfig(wi).focusExercise || (state.exercises.find(e=>e.kind==='strength')||{}).id || '';
    CB.learningSessions.push(rec);
    CB.learningSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.learning) delete _draft.learning[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.learnDone = true;
  }
  ui.addOn = null; ui.addType = null;
  saveState(); renderCurrent();
}
function deleteRecord(spec){
  const [kind, idx] = spec.split('|'); const i = Number(idx);
  if(kind==='coach') CB.coachRuns.splice(i,1);
  if(kind==='strength') CB.strengthSessions.splice(i,1);
  if(kind==='walk') CB.walks.splice(i,1);
  if(kind==='learning') CB.learningSessions.splice(i,1);
  saveState(); renderCurrent();
}
